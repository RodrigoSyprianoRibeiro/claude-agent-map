const ESFORCOS_UI = ['low', 'medium', 'high', 'xhigh', 'max'];
function rotuloModelo(id) {  // claude-opus-5-5 -> "Opus 5.5"; claude-haiku-4-5-20251001 -> "Haiku 4.5"
  const m = /^claude-([a-z]+)-(\d+)(?:-(\d{1,2}))?(?:-\d{8})?/.exec(id || '');
  if (!m) return id ? nomeCurtoModelo(id) : 'modelo';
  return m[1][0].toUpperCase() + m[1].slice(1) + ' ' + m[2] + (m[3] ? '.' + m[3] : '');
}
function guardarEsforco(job, v) { try { sessionStorage.setItem('mapa.esforco.' + job, v); } catch (_) { /* opcional */ } }
function lerEsforco(job) { try { return sessionStorage.getItem('mapa.esforco.' + job) || ''; } catch (_) { return ''; } }

async function subirImagem(arquivo) {
  if (!/^image\/(png|jpeg|webp|gif)$/.test(arquivo.type)) { aviso('Só imagens png, jpeg, webp ou gif.', true); return null; }
  if (arquivo.size > 15 * 1024 * 1024) { aviso('Imagem maior que 15 MB.', true); return null; }
  try {
    const r = await fetch('/api/anexo', { method: 'POST', headers: { 'Content-Type': arquivo.type, 'X-Token': TOKEN }, body: arquivo });
    const j = await r.json();
    if (!r.ok) { aviso(j.erro || 'Falha no envio da imagem (' + r.status + ')', true); return null; }
    return j.id;
  } catch (_) { aviso('Falha no envio da imagem.', true); return null; }
}

  // sem conexao pronta (sessao iniciando, attach ainda desenhando): enfileira e envia quando conectar

    if (t.ws && t.ws.readyState === 1 && t.pronto) { t.ws.send(JSON.stringify(obj)); return true; }
    if (t.pendente || (t.ws && t.ws.readyState <= 1)) { t.fila.push(obj); aviso('Na fila: envio assim que o terminal conectar.'); return true; }

  };

  function pintarAnexos() {
    lista.textContent = '';

      m.append(img, x); lista.append(m);

  }
  async function adicionar(arquivos) {

    }

  }
  function enviarMensagem() {

  }

  caixa.addEventListener('input', () => { ajustarAltura(); atualizarEnviar(); });

    // Esc com a caixa vazia interrompe o turno em andamento (como na extensao do VSCode)
    else if (e.key === 'Escape' && !e.ctrlKey && !caixa.value && t.area.classList.contains('trabalhando')) { e.preventDefault(); mandar({ tipo: 'interromper' }); }

    if (imagens.length) adicionar(imagens); else aviso('Solte uma imagem (png, jpeg, webp ou gif).', true);
  });
  anexar.addEventListener('click', () => seletor.click());
  seletor.addEventListener('change', () => { adicionar([...seletor.files]); seletor.value = ''; });
  enviar.addEventListener('click', enviarMensagem);

  function menuPilula(botao, opcoes, atual, aoEscolher) {
    const aberto = botao.querySelector('.menu-pilula');

// o modelo atual vem do detalhe da sessao (message.model mais recente)
async function atualizarModeloDoTerminal(t) {
  if (!terminais.has(t.job)) return;
  if (Date.now() - t.escolhaEm < 20000) { setTimeout(() => atualizarModeloDoTerminal(t), 8000); return; }
  const s = [...sessoes.values()].find(x => x.jobId === t.job);
  if (s) {
    try {
      const r = await fetch('/api/sessao/' + encodeURIComponent(s.id), { cache: 'no-store' });
      if (r.ok) {
        const d = await r.json();
        const id = d.principal && d.principal.modelo;
        const cfg = d.config || {};
        if (id && id !== t.modeloId) { t.modeloId = id; t.modeloRotulo = rotuloModelo(id); t.modeloAtual = (MODELOS_UI.find(([v]) => id.includes(v)) || [])[0]; t.pintarPilulas(); }
        else if (!id && !t.modeloId && cfg.modelo) {  // antes da primeira resposta: o modelo da criacao
          const par = MODELOS_UI.find(([v]) => v === cfg.modelo);
          if (par) { t.modeloAtual = par[0]; t.modeloRotulo = par[1]; t.pintarPilulas(); }
        }
        if (cfg.esforco && cfg.esforco !== t.esforco) { t.esforco = cfg.esforco; guardarEsforco(t.job, cfg.esforco); t.pintarPilulas(); }
      }
    } catch (_) { /* tenta de novo no proximo ciclo */ }
  }
  setTimeout(() => atualizarModeloDoTerminal(t), s ? 8000 : 1500);  // sessao nova ainda fora do estado: tenta logo
}

// O texto e DOM de verdade (selecionar, Ctrl+C, copiar bloco). O xterm segue conectado e invisivel:
// e por ele que a mensagem entra e que aparecem os menus (permissao, /model), lidos da tela e virados botoes.
const MD_OK = !!(window.marked && window.DOMPurify);
if (MD_OK) marked.setOptions({ gfm: true, breaks: false });
const SO_TEXTO = { FORBID_TAGS: ['style', 'img', 'form', 'input', 'button', 'iframe', 'svg', 'math'], FORBID_ATTR: ['style', 'class', 'id'] };

async function copiarTexto(texto) {
  try { await navigator.clipboard.writeText(texto); return true; } catch (_) { /* sem permissao: plano B */ }
  const area = el('textarea'); area.value = texto; area.style.position = 'fixed'; area.style.opacity = '0';
  document.body.append(area); area.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
  area.remove();
  return ok;
}
function botaoCopiar(obterTexto, rotulo) {
  const b = el('button', 'bt-mini', rotulo || 'copiar');
  b.type = 'button';
  b.addEventListener('click', async ev => {
    ev.stopPropagation();
    const ok = await copiarTexto(obterTexto());
    b.textContent = ok ? 'copiado' : 'falhou';
    setTimeout(() => { b.textContent = rotulo || 'copiar'; }, 1200);
  });
  return b;
}
function markdown(texto) {
  const div = el('div', 'md');
  if (!MD_OK) { div.textContent = texto; div.style.whiteSpace = 'pre-wrap'; return div; }
  div.innerHTML = DOMPurify.sanitize(marked.parse(texto), SO_TEXTO);
  for (const a of div.querySelectorAll('a')) {
    if (!/^https?:\/\//i.test(a.getAttribute('href') || '')) a.removeAttribute('href');
    a.target = '_blank'; a.rel = 'noopener noreferrer';
  }
  for (const pre of div.querySelectorAll('pre')) {
    const caixa = el('div', 'bloco-cod');
    pre.replaceWith(caixa);
    caixa.append(pre, botaoCopiar(() => pre.textContent));
  }
  return div;
}

function horaDe(ts) { return ts ? new Date(ts * 1000).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : ''; }

function sessaoDoTerminal(t) {
  if (t.sidFixo) return sessoes.get(t.sidFixo);

function reiniciarConversa(t, sid) {

async function buscarConversa(sid, params) {

  if (!r.ok) return { erro: r.status };

}
// polling: 1 s com a aba visivel, 5 s escondida; o servidor so manda o que foi acrescentado
async function puxarConversa(t) {
  const c = t.conv;
  if (!c || t.fechada || c.buscando) return;
  clearTimeout(c.timer);
  c.buscando = true;
  let espera = 1000;
  try {
    const s = sessaoDoTerminal(t);
    const sid = t.sidFixo || (s && s.id) || c.sid;
    if (sid && sid !== c.sid) reiniciarConversa(t, sid);  // /clear troca o id da sessao do mesmo job
    if (sid) {
      const d = await buscarConversa(sid, c.cursor == null ? '' : '?desde=' + c.cursor);
      if (c.sid === sid && !t.fechada) {
        if (d.erro === 404) { if (!c.lista.childElementCount) c.vazio.textContent = t.pendente ? c.vazio.textContent : 'Sem mensagens ainda. Escreva abaixo.'; espera = 1500; }
        else if (d.erro) espera = 3000;
        else if (d.reiniciar) { reiniciarConversa(t, sid); espera = 50; }
        else {
          const primeira = c.cursor == null;
          c.cursor = d.cursor;
          if (primeira) { c.inicio = d.inicio; c.topo.hidden = !d.inicio; }
          adicionarItens(t, d.itens, false);
          if (primeira && !d.itens.length) c.vazio.textContent = 'Sem mensagens ainda. Escreva abaixo.';
          if (d.mais) espera = 50;
        }
      }
    } else espera = 1500;
  } catch (_) { espera = 3000; }
  c.buscando = false;
  atualizarStatusConversa(t);
  if (t.fechada) return;
  const visivel = !document.hidden && !doca.hidden && !!t.col && t.col.ativa === t.job;
  c.timer = setTimeout(() => puxarConversa(t), visivel ? espera : Math.max(espera, 5000));
}
async function carregarAnteriores(t) {
  const c = t.conv;
  if (!c.sid || !c.inicio) return;
  const botao = c.topo.firstChild;
  botao.disabled = true; botao.textContent = 'carregando…';
  try {
    const d = await buscarConversa(c.sid, '?ate=' + c.inicio);
    if (!d.erro) { c.inicio = d.inicio; adicionarItens(t, d.itens, true); }
  } catch (_) { /* tenta de novo no clique */ }
  botao.disabled = false; botao.textContent = 'carregar mensagens anteriores';
  c.topo.hidden = !c.inicio;
}
function adicionarItens(t, itens, antes) {
  const c = t.conv;
  if (!itens.length) return;
  const frag = document.createDocumentFragment();
  let chegouUsuario = false;
  for (const it of itens) {
    const e = elementoDoItem(t, it);
    if (e) { if (it.ts) e.title = e.title || horaDe(it.ts); frag.append(e); }
    if (it.t === 'usuario') chegouUsuario = true;
  }
  if (!frag.childNodes.length) return;
  c.vazio.hidden = true;
  if (antes) {
    const h = c.scroller.scrollHeight;
    c.lista.prepend(frag);
    c.scroller.scrollTop += c.scroller.scrollHeight - h;  // segura o que estava na tela
    return;
  }
  if (chegouUsuario && c.fantasma) { c.fantasma.remove(); c.fantasma = null; }
  if (c.fantasma) c.lista.insertBefore(frag, c.fantasma); else c.lista.append(frag);
  rolarSeNoFim(t);
}
function elementoDoItem(t, it) {
  switch (it.t) {
    case 'usuario': {
      const d = el('div', 'msg-u');
      if (it.texto) d.append(el('div', 'msg-u-tx', it.texto));
      if (it.imagens) d.append(el('div', 'chip', it.imagens + (it.imagens > 1 ? ' imagens' : ' imagem')));
      acoesDaMensagem(d, it.texto || '');
      return d;
    }
    case 'texto': {
      const d = el('div', 'msg-a');
      d.append(markdown(it.texto));
      acoesDaMensagem(d, it.texto);
      return d;
    }
    case 'pensou': {
      if (!it.texto || !it.texto.trim()) return null;  // pensamento redigido: so a assinatura, nada a mostrar
      const det = el('details', 'pensou');
      det.append(el('summary', null, 'Pensamento'), el('div', 'pensou-tx', it.texto));
      return det;
    }
    case 'ferramenta': return elementoFerramenta(t, it);
    case 'resultado': aplicarResultado(t, it); return null;
    case 'aviso': {
      if (it.tipo === 'saida') { const p = el('pre', 'cod', it.texto); return p; }
      const rot = it.tipo === 'interrompido' ? 'Interrompido pelo usuário' : it.texto;
      return el('div', 'aviso-c ' + (it.tipo || ''), rot);
    }
    default: return null;
  }
}

function elementoFerramenta(t, it) {
  const box = el('div', 'ferr pendente');
  const cab = el('button', 'ferr-cab');
  cab.type = 'button';
  cab.append(el('span', 'ferr-pt'), el('b', null, it.nome), el('span', 'ferr-rs', it.resumo || ''));
  const corpo = el('div', 'ferr-corpo'); corpo.hidden = true;
  box.append(cab, corpo);
  box._it = it; box._res = null;
  const abrir = sim => { corpo.hidden = !sim; box.classList.toggle('aberta', sim); if (sim) preencherFerramenta(box); };
  cab.addEventListener('click', () => abrir(corpo.hidden));
  box._abrir = abrir;
  if (it.nome === 'Edit' || it.nome === 'MultiEdit') abrir(true);  // diff a vista, como no VSCode
  t.conv.ferr.set(it.id, box);
  const orfao = t.conv.orfaos.get(it.id);
  if (orfao) { t.conv.orfaos.delete(it.id); aplicarResultado(t, orfao); }
  return box;
}
function aplicarResultado(t, it) {
  const box = t.conv.ferr.get(it.id);
  if (!box) { t.conv.orfaos.set(it.id, it); return; }  // o tool_use esta numa janela ainda nao carregada
  box._res = it;
  box.classList.remove('pendente');
  box.classList.add(it.erro ? 'erro' : 'ok');
  if (it.erro && !box.classList.contains('aberta')) box._abrir(true);
  else if (!box.querySelector('.ferr-corpo').hidden) preencherFerramenta(box);
}
function linhaFerramenta(rotulo, conteudo, erro) {
  const l = el('div', 'ferr-linha' + (erro ? ' erro' : ''));
  l.append(el('span', null, rotulo));
  if (typeof conteudo === 'string') l.append(el('pre', null, conteudo)); else l.append(conteudo);
  return l;
}
function diffSimples(velho, novo) {
  const d = el('div', 'diff');
  for (const linha of (velho || '').split('\n')) d.append(el('div', 'rem', '- ' + linha));
  for (const linha of (novo || '').split('\n')) d.append(el('div', 'add', '+ ' + linha));
  return d;
}
function preencherFerramenta(box) {
  const it = box._it, res = box._res, e = it.entrada || {};
  const corpo = box.querySelector('.ferr-corpo');
  corpo.textContent = '';
  if (it.nome === 'Bash') corpo.append(linhaFerramenta('IN', e.command || ''));
  else if (it.nome === 'Edit') corpo.append(linhaFerramenta('IN', (e.file_path || '') + (e.replace_all === 'true' ? '  (todas as ocorrências)' : '')), linhaFerramenta('', diffSimples(e.old_string, e.new_string)));
  else if (it.nome === 'Write') corpo.append(linhaFerramenta('IN', e.file_path || ''), linhaFerramenta('', e.content || ''));
  else {
    const chaves = Object.keys(e);
    if (chaves.length) corpo.append(linhaFerramenta('IN', chaves.map(k => k + ': ' + e[k]).join('\n')));
  }
  const ocultarSaida = res && !res.erro && (it.nome === 'Edit' || it.nome === 'Write');
  if (res && !ocultarSaida) {
    let texto = res.texto || (res.imagens ? '' : '(sem saída)');
    if (res.imagens) texto += (texto ? '\n' : '') + '[' + res.imagens + (res.imagens > 1 ? ' imagens]' : ' imagem]');
    if (res.cortado) texto += '\n… mais ' + res.cortado.toLocaleString('pt-BR') + ' caracteres';
    corpo.append(linhaFerramenta('OUT', texto, res.erro));
  } else if (!res) corpo.append(linhaFerramenta('OUT', 'aguardando…'));
}

// spinner do turno: a linha "… (esc to interrupt)" da tela do CLI, ou o tempo desde o inicio do turno
// aba criada pelo "+ sessao" nasce com o nome do no ("geral"): assim que a sessao tem titulo (ou ao
// menos o primeiro prompt), a aba passa a mostrar isso, como as abertas pela lista
function renomearAba(t, s) {
  if (!s || t.pendente || !(s.titulo || s.nome || s.primeiroPrompt)) return;
  const nome = tituloCurto(s, 24);
  if (nome === t.nome) return;
  t.nome = nome;
  t.rotulo.textContent = nome;
  t.aba.title = s.titulo || s.nome || s.primeiroPrompt;
  salvarLayout();
}
function atualizarStatusConversa(t) {
  if (!t.conv) return;
  const s = sessaoDoTerminal(t);
  renomearAba(t, s);
  const trabalhando = !!s && s.coluna === 'trabalhando';
  t.area.classList.toggle('trabalhando', trabalhando || !!t.linhaSpinner);
  const mostrar = trabalhando || !!t.linhaSpinner;
  const estava = !t.conv.fim.hidden;
  t.conv.fim.hidden = !mostrar;
  if (mostrar) {
    const desde = s && (s.inicioTurno || s.inicioTurnoAproximado);
    t.conv.fimTexto.textContent = t.linhaSpinner || ('Trabalhando' + (desde ? ' · ' + fmtDur(agora() - desde) : '') + '…');
    if (!estava) rolarSeNoFim(t);
  }
  atualizarPergunta(t, s);
}

const BORDA_TUI = /[│┃╭╮╰╯─━┌┐└┘├┤╌╎]/g;
const OPCAO_TUI = /^\s*([❯›>])?\s*(\d{1,2})[.)]\s+(\S.*)$/;
const DICA_DIALOGO_TUI = /\b(space to select|enter to (confirm|select)|esc to (cancel|reject|exit|go back))/i;
function lerTelaDoTerminal(t) {
  if (!t.term || t.fechada) return;
  const b = t.term.buffer.active, linhas = [], bordas = new Set();
  for (let i = b.viewportY; i < b.viewportY + t.term.rows; i++) {
    const l = b.getLine(i);
    const crua = l ? l.translateToString(true) : '';
    if (/^\s*[╭╰┌└─━]{3}/.test(crua) && !crua.replace(BORDA_TUI, '').trim()) bordas.add(linhas.length);  // topo do dialogo
    linhas.push(crua.replace(BORDA_TUI, ' ').replace(/\s+$/, ''));
  }
  const sp = linhas.find(l => /esc to interrupt/i.test(l));
  t.linhaSpinner = sp ? sp.trim().replace(/^[^\p{L}\p{N}]+/u, '') : '';
  // menu do CLI: opcoes 1., 2., ... com o cursor ❯ numa delas (lista numerada de resposta nao tem cursor)
  let opcoes = [], primeira = -1, melhor = null;
  for (let i = 0; i < linhas.length; i++) {
    const m = OPCAO_TUI.exec(linhas[i]);
    if (!m) continue;
    const n = +m[2];
    if (n === 1) { if (opcoes.length && opcoes.some(o => o.sel)) melhor = { opcoes, primeira }; opcoes = []; primeira = i; }
    if (n === opcoes.length + 1) opcoes.push({ n, texto: m[3].trim(), sel: !!m[1] });
  }
  if (opcoes.length && opcoes.some(o => o.sel)) melhor = { opcoes, primeira };
  if (melhor && melhor.opcoes.length >= 2) {
    let ini = Math.max(0, melhor.primeira - 10);
    for (let i = melhor.primeira - 1; i >= ini; i--) if (bordas.has(i)) { ini = i + 1; break; }
    const contexto = linhas.slice(ini, melhor.primeira).map(l => l.trimEnd());
    while (contexto.length && !contexto[0].trim()) contexto.shift();
    t.menuTela = { opcoes: melhor.opcoes, contexto: contexto.join('\n').replace(/\n{3,}/g, '\n\n').trim() };
  } else t.menuTela = null;
  // dialogo sem opcoes numeradas (servidores MCP do projeto com checkbox, por exemplo): so o terminal responde
  t.dialogoTela = !t.menuTela && linhas.some(l => DICA_DIALOGO_TUI.test(l));
  atualizarStatusConversa(t);
}
function atualizarPergunta(t, s) {
  const p = t.pergunta;
  if (!p || !t.term) return;
  const menu = t.menuTela;
  const assinatura = menu ? JSON.stringify(menu) : (t.dialogoTela || (s && s.coluna === 'atencao') ? 'atencao' : '');
  const escondido = !assinatura || t.modo === 'terminal';  // no modo terminal o proprio menu esta na tela
  const mudouVisibilidade = p.hidden !== escondido;
  p.hidden = escondido;
  if (assinatura === t.assinaturaPergunta) { if (mudouVisibilidade && !escondido) rolarSeNoFim(t); return; }
  t.assinaturaPergunta = assinatura;
  p.textContent = '';
  if (!assinatura) return;
  if (menu) {
    if (menu.contexto) p.append(el('pre', null, menu.contexto));
    const ops = el('div', 'ops');
    const atual = menu.opcoes.findIndex(o => o.sel);
    for (const [i, o] of menu.opcoes.entries()) {
      const b = el('button', 'bt' + (o.sel ? ' sel' : ''), o.n + '. ' + o.texto);
      b.addEventListener('click', () => escolherOpcao(t, i - atual));
      ops.append(b);
    }
    const esc = el('button', 'bt', 'Esc'); esc.title = 'Cancelar o menu';
    esc.addEventListener('click', () => enviarTecla(t, '\x1b'));
    const ver = el('button', 'bt', 'Ver no terminal');
    ver.addEventListener('click', () => definirModo(t, 'terminal'));
    ops.append(esc, ver);
    p.append(ops);
  } else {
    p.append(el('pre', null, 'A sessão está esperando você no terminal (permissão, pergunta ou liberar os servidores MCP do projeto).'));
    const ver = el('button', 'bt', 'Abrir o terminal');
    ver.addEventListener('click', () => definirModo(t, 'terminal'));
    p.append(ver);
  }
  rolarSeNoFim(t);
}
function enviarTecla(t, dados) {
  if (t.ws && t.ws.readyState === 1) { t.ws.send(dados); return true; }
  aviso('Terminal desconectado.', true); return false;
}
// anda com as setas ate a opcao e confirma com Enter: funciona em qualquer menu do CLI
function escolherOpcao(t, delta) {
  const seta = delta > 0 ? '\x1b[B' : '\x1b[A';
  if (!enviarTecla(t, seta.repeat(Math.abs(delta)) + '\r')) return;
  t.menuTela = null; t.assinaturaPergunta = 'respondida'; t.pergunta.hidden = true;
}

// clique na lista: foca a aba que ja mostra a sessao; senao abre (conversa com attach se for --bg, so leitura nas outras)
function abrirConversaDaSessao(s) {
  const bg = s.aberta && (s.tipo === 'bg' || s.tipo === 'background') && s.jobId;
  for (const [chave, t] of terminais) {
    if (t.fechada) continue;
    if ((s.jobId && t.job === s.jobId) || t.sidFixo === s.id || (t.conv && t.conv.sid === s.id)) {
      if (bg && t.sidFixo) continue;  // aba so leitura de uma sessao que agora roda em --bg: abre a que escreve
      mostrarDoca(true); ativarAba(chave); return;
    }
  }
  if (bg) abrirTerminal(s.jobId, tituloCurto(s, 24));
  else if (/^[0-9a-f-]{36}$/i.test(s.id)) verConversa(s);
}

// aba so de leitura: qualquer sessao (aberta no VSCode ou fechada), sem attach
function verConversa(s) {
  const chave = 'ver:' + s.id;
  if (terminais.has(chave)) { mostrarDoca(true); ativarAba(chave); return; }
  const t = criarAba(chave, tituloCurto(s, 24), true);
  t.sidFixo = s.id;
  t.aba.title = 'Somente leitura';
  const bg = s.tipo === 'bg' || s.tipo === 'background';
  const nota = el('div', 'nota-leitura', !s.aberta ? 'Somente leitura: sessão fechada.'
    : bg ? 'Somente leitura: para escrever, use "Abrir conversa" no detalhe.' : 'Somente leitura: esta sessão está aberta no VSCode.');
  if (!s.aberta) {
    const b = el('button', 'bt', 'Assumir aqui');
    b.addEventListener('click', async () => { if (await assumirSessao(s, b)) fecharAba(chave); });
    nota.append(b);
  }
  t.area.append(nota);
  puxarConversa(t);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) for (const c of colunas) { const t = terminais.get(c.ativa); if (t) puxarConversa(t); } });

// ---------- acoes sobre sessoes ----------
async function pararSessao(s) {
  if (!confirm('Parar a sessão em segundo plano "' + tituloCurto(s, 50) + '"?\n\nEla é encerrada (a conversa fica salva e pode ser retomada).')) return;
  const r = await postar('/api/parar', { id: s.jobId });
  if (!r.ok) { aviso('Não parou: ' + (r.dados.erro || r.status), true); return; }
  if (terminais.has(s.jobId)) fecharAba(s.jobId);
  aviso('Sessão parada.');
}
async function assumirSessao(s, botao) {
  botao.disabled = true; botao.textContent = 'Assumindo…';
  const r = await postar('/api/assumir', { id: s.id });
  botao.disabled = false; botao.textContent = 'Assumir aqui';
  if (!r.ok) { aviso(r.dados.erro || 'Não foi possível assumir (' + r.status + ')', true); return false; }
  aviso('Sessão retomada em segundo plano.');
  abrirTerminal(r.dados.jobId, tituloCurto(s, 24));
  return true;
}

// ---------- nova sessao ----------
const dlgNova = document.getElementById('dlg-nova');
// no inicial do dialogo: o clicado, o do foco, o geral da regiao em foco, o primeiro da regiao, o primeiro com pasta
function noInicialDoDialogo(lista, noId) {
  const ids = new Set(lista.map(n => n.id));
  if (noId && ids.has(noId)) return noId;
  if (noFoco && ids.has(noFoco)) return noFoco;
  if (foco.no && ids.has(foco.no)) return foco.no;
  if (foco.regiao) {
    const daRegiao = lista.filter(n => n.regiao === foco.regiao);
    const geral = daRegiao.find(n => n.id === foco.regiao + '/geral');
    if (geral) return geral.id;
    if (daRegiao.length) return daRegiao[0].id;
  }
  return (lista.find(n => grandes.length && n.id === grandes[0] + '/geral') || lista[0]).id;
}
function abrirDialogoNova(noId) {
  const sel = document.getElementById('nv-no');
  sel.textContent = '';
  // so nos com pasta conhecida: o servidor resolve a pasta a partir do no e recusa o resto
  const lista = todosNos.filter(n => n.caminho).sort((a, b) => a.regiao.localeCompare(b.regiao) || a.nome.localeCompare(b.nome));
  if (!lista.length) { aviso('Nenhum projeto com pasta conhecida.', true); return; }
  for (const n of lista) { const o = el('option', null, nomeDaRegiao(n.regiao) + ' / ' + n.nome); o.value = n.id; sel.append(o); }
  sel.value = noInicialDoDialogo(lista, noId);
  document.getElementById('nv-prompt').value = '';
  document.getElementById('nv-nome').value = '';
  document.getElementById('nv-modelo').value = '';
  document.getElementById('nv-esforco').value = '';
  dlgNova.showModal();
  document.getElementById('nv-prompt').focus();
}
document.getElementById('nv-cancelar').addEventListener('click', () => dlgNova.close());
document.getElementById('form-nova').addEventListener('submit', async e => {
  e.preventDefault();
  if (!document.getElementById('nv-no').value) { aviso('Escolha o projeto da sessão.', true); return; }
  const botao = document.getElementById('nv-criar');
  botao.disabled = true; botao.textContent = 'Criando…';
  const nome = document.getElementById('nv-nome').value.trim();
  const modelo = document.getElementById('nv-modelo').value, esforco = document.getElementById('nv-esforco').value;
  const r = await postar('/api/nova-sessao', { no: document.getElementById('nv-no').value, prompt: document.getElementById('nv-prompt').value, nome, modelo, esforco });
  botao.disabled = false; botao.textContent = 'Criar e abrir terminal';
  if (!r.ok) {
    aviso(r.dados.codigo === 'nao_confiavel' ? 'Esta pasta ainda não é confiável para o Claude: use o botão "+ sessão" (clique direto) nela para confiar.' : (r.dados.erro || 'Não foi possível criar (' + r.status + ')'), true);
    return;
  }
  dlgNova.close();
  if (esforco) guardarEsforco(r.dados.jobId, esforco);
  abrirTerminal(r.dados.jobId, nome || r.dados.jobId);
});

const dica = document.getElementById('dica');
function mostrarDica(e, s, n) {

// ---------- HUD ----------
function atualizarContadores() {
  const c = { atencao: 0, trabalhando: 0, suaVez: 0 };
  for (const s of sessoes.values()) if (c[s.coluna] != null) c[s.coluna]++;
  document.querySelector('#n-atencao b').textContent = c.atencao;
  document.querySelector('#n-trabalhando b').textContent = c.trabalhando;
  document.querySelector('#n-suavez b').textContent = c.suaVez;
  document.getElementById('n-atencao').classList.toggle('vivo', c.atencao > 0 && escalaMovimento >= 1);
  atualizarTitulo();
}

let assinaturaLista = null;
let refsTempo = [];
function atualizarLista(forcar) {
  const abertas = [...sessoes.values()].filter(s => s.aberta && (!busca || s.casa))
    .sort((a, b) => ORDEM_COLUNA[a.coluna] - ORDEM_COLUNA[b.coluna] || (b.ultimaAtividade || 0) - (a.ultimaAtividade || 0));
  const assinatura = abertas.map(s => s.id + s.coluna + (s.titulo || '') + (s.id === selecionada ? '*' : '')).join('|');
  if (!forcar && assinatura === assinaturaLista) return;
  assinaturaLista = assinatura;
  const cont = document.getElementById('itens');
  cont.textContent = '';
  refsTempo = [];
  if (!abertas.length) { cont.append(el('div', 'vazio', 'Nenhuma sessão aberta.')); return; }
  let grupoAtual = null;
  const contagens = {};
  for (const s of abertas) contagens[s.coluna] = (contagens[s.coluna] || 0) + 1;
  for (const s of abertas) {
    if (s.coluna !== grupoAtual) { grupoAtual = s.coluna; cont.append(el('div', 'grupo', NOME_COLUNA[s.coluna] + ' (' + contagens[s.coluna] + ')')); }
    const b = el('button', 'item' + (s.id === selecionada ? ' sel' : ''));
    const ponto = el('span', 'pt'); ponto.style.background = rgba(COR[s.coluna], 1); ponto.style.boxShadow = '0 0 8px ' + rgba(COR[s.coluna], 0.8);
    const meio = el('span', 'tt', tituloCurto(s, 44));
    meio.append(el('span', 'pj', [s.projeto, s.subprojeto].filter(Boolean).join(' / ')));
    const tempo = el('span', 'tp', tempoDe(s, agora()));
    b.append(ponto, meio, tempo);
    b.addEventListener('click', () => { selecionar(s.id); centralizar(s); abrirConversaDaSessao(s); });
    cont.append(b);
    refsTempo.push([s, tempo]);
  }
}
document.getElementById('alca').addEventListener('click', () => {
  const rec = document.getElementById('lista').classList.toggle('recolhida');
  const a = document.getElementById('alca');
  a.classList.toggle('recolhida', rec);
  a.innerHTML = rec ? '&rsaquo;' : '&lsaquo;';
});

function centralizar(s) {
  if (!s) return;
  seguindo = s.id;
  alvo.k = Math.max(alvo.k, 1.1);
}

// ---------- detalhe: subagentes, advisor, custo por modelo, linha do tempo ----------
const COR_MODELO = { opus: [180, 120, 255], sonnet: [255, 150, 60], haiku: [70, 210, 120], fable: [80, 170, 255] };
function corDoModelo(m) {
  const k = Object.keys(COR_MODELO).find(x => (m || '').includes(x));
  return k ? COR_MODELO[k] : [150, 160, 175];
}
function nomeCurtoModelo(m) { return (m || '?').replace(/^claude-/, '').replace(/-\d{8}$/, ''); }
let extra = null, extraAss = '', buscandoExtra = false;
function coresSatelites(s) {
  // sessao selecionada com detalhe carregado: um satelite por subagente rodando, na cor do modelo real
  if (extra && extra.id === s.id) {
    const cores = extra.subagentes.filter(x => x.status === 'rodando').map(x => corDoModelo(x.modelo));
    if (cores.length || !s.subagentesRodando) return cores;
  }
  return Array.from({ length: s.subagentesRodando || 0 }, () => [120, 220, 255]);
}
async function buscarExtra() {
  const id = selecionada;
  if (!id || buscandoExtra) return;
  buscandoExtra = true;
  try {
    const r = await fetch('/api/sessao/' + encodeURIComponent(id), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (selecionada !== id) return;
    const ass = JSON.stringify(d, (k, v) => k === 'geradoEm' ? undefined : v);
    if (ass !== extraAss) { extra = d; extraAss = ass; renderExtra(); }
  } catch (_) { /* tenta de novo em 3 s */ } finally { buscandoExtra = false; }
}
setInterval(() => { if (selecionada && !document.hidden) buscarExtra(); }, 3000);

const dolar = v => 'US$ ' + (v < 0.01 && v > 0 ? '<0,01' : v.toFixed(2).replace('.', ','));
const hora = t => t ? new Date(t * 1000).toLocaleTimeString('pt-BR') : '';
function textoTempoSub(x, t) {
  if (x.status === 'rodando') return 'rodando há ' + fmtDur(t - (x.inicio || t));
  const fim = x.fim || x.atualizadoEm;
  if (x.status === 'concluido') return 'durou ' + fmtDur(x.duracao || 0) + ' · terminou há ' + fmtDur(t - fim);
  return 'parado há ' + fmtDur(t - x.atualizadoEm);
}
function renderExtra() {
  const alvoEl = document.getElementById('d-extra');
  if (!alvoEl) return;
  alvoEl.textContent = '';
  if (!extra || extra.id !== selecionada) { alvoEl.append(el('div', 'nota', 'Carregando subagentes…')); return; }
  const t = agora();
  const subs = extra.subagentes;
  const rod = subs.filter(x => x.status === 'rodando').length;
  alvoEl.append(el('div', 'bloco', 'Subagentes (' + subs.length + (rod ? ', ' + rod + ' rodando' : '') + ')'));
  if (!subs.length) alvoEl.append(el('div', 'nota', 'Nenhum subagente nesta sessão.'));
  const arv = el('div', 'arvore');
  for (const x of subs.slice().reverse()) {
    const linha = el('div', 'sub');
    const l1 = el('div', 'l1');
    const pm = el('span', 'pm'); const c = corDoModelo(x.modelo);
    pm.style.background = rgba(c, 1); pm.style.boxShadow = '0 0 7px ' + rgba(c, 0.8); pm.title = x.modelo || 'modelo desconhecido';
    l1.append(pm, el('span', 'tp', x.tipo), el('span', 'ds', x.descricao), el('span', 'cs', dolar(x.custo)));
    const l2 = el('div', 'l2');
    const st = el('span', 'st-' + x.status, x.status === 'concluido' ? 'concluído' : x.status);
    const tm = el('span', 'tm', textoTempoSub(x, t));
    tm.dataset.sub = x.id;
    l2.append(st, document.createTextNode(' · '), tm, document.createTextNode(' · ' + nomeCurtoModelo(x.modelo) + ' · ' + x.ferramentas + ' ferramentas'));
    if (x.ultima) l2.append(document.createTextNode(' · última: ' + x.ultima.ferramenta + (x.ultima.resumo ? ' ' + x.ultima.resumo : '')));
    linha.append(l1, l2);
    arv.append(linha);
  }
  alvoEl.append(arv);

  const adv = extra.advisor;
  alvoEl.append(el('div', 'bloco', 'Advisor'));
  if (!adv.consultas.length) alvoEl.append(el('div', 'nota', 'Sem consultas ao advisor.'));
  else {
    alvoEl.append(el('div', null, adv.consultas.length + ' consulta(s) · ' + dolar(adv.custo)));
    const lt = el('div', 'linha-tempo');
    for (const e of adv.consultas.slice(-8).reverse()) {
      const d = el('div');
      d.append(el('span', 'h', hora(e.ts)), el('span', 'f', nomeCurtoModelo(e.modelo)),
        el('span', 'r', 'leu ' + Math.round(e.tokensLidos / 1000) + 'k tokens · ' + dolar(e.custo)));
      lt.append(d);
    }
    alvoEl.append(lt);
  }

  alvoEl.append(el('div', 'bloco', 'Custo por modelo'));
  const maximo = Math.max(0.0001, ...extra.custoPorModelo.map(m => m.custo));
  for (const m of extra.custoPorModelo) {
    const b = el('div', 'barra-custo');
    const cel = el('div');
    cel.append(el('div', 'nm', nomeCurtoModelo(m.modelo) + ' · ' + m.chamadas + ' chamadas'));
    const tr = el('div', 'tr'); const pr = el('div', 'pr');
    pr.style.width = Math.max(2, (m.custo / maximo) * 100) + '%'; pr.style.background = rgba(corDoModelo(m.modelo), 0.9);
    tr.append(pr); cel.append(tr);
    b.append(cel, el('div', 'vl', dolar(m.custo)));
    alvoEl.append(b);
  }
  if (extra.parcial) alvoEl.append(el('div', 'nota', 'Transcrito grande: o custo da sessão principal vem só dos últimos ~4 MB.'));

  alvoEl.append(el('div', 'bloco', 'Últimas ferramentas'));
  const lt = el('div', 'linha-tempo');
  for (const f of extra.ferramentas.slice().reverse()) {
    const d = el('div');
    d.append(el('span', 'h', hora(f.ts)), el('span', 'f', f.ferramenta), el('span', 'r', f.resumo));
    lt.append(d);
  }
  if (!extra.ferramentas.length) lt.append(el('div', 'nota', 'Nenhuma ferramenta registrada.'));
  alvoEl.append(lt);
}
function atualizarTemposExtra() {
  if (!extra) return;
  const t = agora();
  for (const e of document.querySelectorAll('#d-extra .tm')) {
    const x = extra.subagentes.find(y => y.id === e.dataset.sub);
    if (x) { const v = textoTempoSub(x, t); if (e.textContent !== v) e.textContent = v; }
  }
}

function selecionar(id) {
  if (selecionada !== id) { extra = null; extraAss = ''; }
  selecionada = id;
  const sel = sessoes.get(id);
  if (sel) noSel = sel.no;
  assinaturaLista = '';
  atualizarLista(true);
  atualizarDetalhe(true);
  buscarExtra();
}
function fecharDetalhe() {
  selecionada = null; seguindo = null; extra = null; extraAss = '';
  document.getElementById('detalhe').classList.remove('aberto');
  assinaturaLista = '';
  atualizarLista(true);
}

let assinaturaDetalhe = '';
function atualizarDetalhe(abrir) {
  const s = sessoes.get(selecionada);
  const painel = document.getElementById('detalhe');
  if (!s) return;
  const t = agora();
  const aproximado = !s.inicioTurno && !!s.inicioTurnoAproximado && s.coluna === 'trabalhando';
  const emAndamento = (s.inicioTurno && (!s.fimTurno || s.fimTurno < s.inicioTurno)) || aproximado;
  const assinatura = JSON.stringify([s.id, s.coluna, s.titulo, s.branch, s.inicioTurno, s.inicioTurnoAproximado, s.fimTurno, s.ultimoPrompt, s.ultimaResposta, s.prs, s.custo, s.aberta, s.tipo, s.jobId]);
  if (!abrir && assinatura === assinaturaDetalhe) { atualizarTempoDetalhe(s, t, emAndamento); return; }
  assinaturaDetalhe = assinatura;
  painel.textContent = '';
  const topo = el('div', 'topo');
  const fechar = el('button', 'bt fechar', '×');
  fechar.setAttribute('aria-label', 'Fechar detalhe');
  fechar.addEventListener('click', fecharDetalhe);
  topo.append(el('h3', null, s.titulo || s.nome || s.primeiroPrompt || s.id), fechar);
  painel.append(topo);
  const selo = el('span', 'selo', NOME_COLUNA[s.coluna]);
  selo.style.color = rgba(COR[s.coluna], 1);
  painel.append(selo);

  const dl = el('dl');
  const linha = (rot, val, id) => { const dd = el('dd', null, val); if (id) dd.id = id; dl.append(el('dt', null, rot), dd); };
  linha('Projeto', [s.projeto, s.subprojeto].filter(Boolean).join(' / ') || '—');
  linha('Branch', s.branch || '—');
  linha('Pasta', s.cwd || '—');
  linha('Início da sessão', '', 'd-inicio');
  linha('Turno atual', '', 'd-turno');
  linha('Fim do turno', '', 'd-fim');
  linha('Custo', s.custo != null ? 'US$ ' + s.custo.toFixed(2) : '—');
  if (s.subagentesRodando) linha('Subagentes', s.subagentesRodando + ' rodando');
  painel.append(dl);

  painel.append(el('div', 'bloco', 'Último prompt'));
  painel.append(el('div', 'texto', s.ultimoPrompt || '—'));
  painel.append(el('div', 'bloco', 'Última resposta'));
  painel.append(el('div', 'texto', s.ultimaResposta || '—'));

  const prs = (s.prs || []).filter(p => /^https?:\/\//.test(p.url || ''));
  if (prs.length) {
    painel.append(el('div', 'bloco', 'Pull requests'));
    const ul = el('div');
    for (const p of prs) {
      const a = el('a', null, (p.repo ? p.repo.split('/').pop() : 'PR') + (p.numero ? ' #' + p.numero : ''));
      a.href = p.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      ul.append(a, document.createElement('br'));
    }
    painel.append(ul);
  }

  const acoes = el('div', 'acoes');
  const bg = s.tipo === 'bg' || s.tipo === 'background';
  if (/^[0-9a-f-]{8,64}$/i.test(s.id)) {
    const a = el('a', 'bt acao', 'Abrir no VSCode');
    a.href = 'vscode://anthropic.claude-code/open?session=' + encodeURIComponent(s.id);
    acoes.append(a);
  }
  if (s.aberta && bg && s.jobId) {
    const t1 = el('button', 'bt', 'Abrir conversa');
    t1.title = 'Conversa e terminal desta sessão em segundo plano';
    t1.addEventListener('click', () => abrirTerminal(s.jobId, tituloCurto(s, 24)));
    const t2 = el('button', 'bt perigo', 'Parar');
    t2.addEventListener('click', () => pararSessao(s));
    acoes.append(t1, t2);
  } else if (/^[0-9a-f-]{36}$/i.test(s.id)) {
    const v = el('button', 'bt', 'Ver conversa');
    v.title = 'Lê a conversa (somente leitura)';
    v.addEventListener('click', () => verConversa(s));
    acoes.append(v);
  }
  if (!s.aberta) {
    const t3 = el('button', 'bt', 'Assumir aqui');
    t3.title = 'Retoma esta conversa em segundo plano e abre o terminal';
    t3.addEventListener('click', () => assumirSessao(s, t3));
    acoes.append(t3);
  }
  painel.append(acoes);
  if (s.aberta && !bg) {
    painel.append(el('div', 'nota', 'Aberta numa aba do VSCode: para assumir aqui, feche a aba no VSCode antes. Duas pontas escrevendo na mesma conversa a corromperiam.'));
  }
  const exEl = el('div'); exEl.id = 'd-extra';
  painel.append(exEl);
  renderExtra();
  painel.classList.add('aberto');
  atualizarTempoDetalhe(s, t, emAndamento);
}
function atualizarTempoDetalhe(s, t, emAndamento) {
  const set = (id, v) => { const e = document.getElementById(id); if (e && e.textContent !== v) e.textContent = v; };
  set('d-inicio', s.inicioSessao ? fmtData(s.inicioSessao) + ' (há ' + fmtDur(t - s.inicioSessao) + ')' : '—');
  set('d-turno', !s.inicioTurno ? (s.inicioTurnoAproximado && s.coluna === 'trabalhando'
      ? 'em andamento há mais de ' + fmtDur(t - s.inicioTurnoAproximado) + ' (início fora do trecho lido)' : '—')
    : emAndamento ? fmtData(s.inicioTurno) + ' (em andamento há ' + fmtDur(t - s.inicioTurno) + ')'
      : fmtData(s.inicioTurno) + ' (durou ' + fmtDur(s.fimTurno - s.inicioTurno) + ')');
  set('d-fim', s.fimTurno && !emAndamento ? fmtData(s.fimTurno) + ' (há ' + fmtDur(t - s.fimTurno) + ')' : (emAndamento ? 'em andamento' : '—'));
}

// ---------- uso do plano (status line -> /api/uso) ----------
let usoDados = null, usoBuscadoEm = 0;
const corUso = p => p > 90 ? '#ff3b4f' : p > 70 ? '#ffb020' : '#3ddc84';
const NOME_JANELA = { five_hour: 'Sessão (5h)', seven_day: 'Semanal (7d)' };
function segundosAte(w) { return w && w.resetsEm != null ? Math.max(0, w.resetsEm - (Date.now() - usoBuscadoEm) / 1000) : null; }
function textoZera(w) {
  const seg = segundosAte(w);
  return seg == null ? (w && w.zerada ? 'zerou' : '') : 'zera em ' + fmtDur(seg);
}
function renderUso() {
  const corpo = document.getElementById('uso-corpo');
  const aneis = document.getElementById('uso-aneis');
  corpo.textContent = '';
  if (!usoDados || !usoDados.disponivel) {
    corpo.append(el('div', 'nota', 'Sem dados ainda: o uso chega pelo status line depois da primeira resposta de uma sessão.'));
    aneis.hidden = true;
    return;
  }
  aneis.textContent = ''; aneis.hidden = false;
  const dicas = [];
  for (const nome of ['five_hour', 'seven_day']) {
    const w = usoDados[nome];
    if (!w) continue;
    const p = Math.round(w.usado);
    const linha = el('div', 'uso-linha');
    const l1 = el('div', 'l1'); l1.append(el('span', null, NOME_JANELA[nome]), el('b', null, p + '%'));
    const barra = el('div', 'uso-barra'); const prog = el('i');
    prog.style.width = Math.min(100, w.usado) + '%'; prog.style.background = corUso(w.usado);
    barra.append(prog);
    const l2 = el('div', 'l2', textoZera(w)); l2.dataset.janela = nome;
    linha.append(l1, barra, l2);
    corpo.append(linha);
    dicas.push(NOME_JANELA[nome] + ': ' + p + '%' + (textoZera(w) ? ' · ' + textoZera(w) : ''));
    // anel pequeno na barra superior
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('width', '22'); svg.setAttribute('height', '22'); svg.setAttribute('viewBox', '0 0 22 22');
    const fundo = document.createElementNS(NS, 'circle'); const arco = document.createElementNS(NS, 'circle');
    for (const c of [fundo, arco]) { c.setAttribute('cx', '11'); c.setAttribute('cy', '11'); c.setAttribute('r', '8'); c.setAttribute('fill', 'none'); c.setAttribute('stroke-width', '3'); }
    fundo.setAttribute('stroke', 'rgba(255,255,255,0.12)');
    const circ = 2 * Math.PI * 8;
    arco.setAttribute('stroke', corUso(w.usado)); arco.setAttribute('stroke-linecap', 'round');
    arco.setAttribute('stroke-dasharray', (circ * Math.min(100, w.usado) / 100) + ' ' + circ); arco.setAttribute('transform', 'rotate(-90 11 11)');
    const tx = document.createElementNS(NS, 'text'); tx.setAttribute('x', '11'); tx.setAttribute('y', '14'); tx.setAttribute('text-anchor', 'middle');
    tx.setAttribute('font-size', '7'); tx.setAttribute('fill', '#9db0cc'); tx.textContent = nome === 'five_hour' ? '5h' : '7d';
    svg.append(fundo, arco, tx); aneis.append(svg);
  }
  const velho = usoDados.velho;
  const nota = el('div', null, usoDados.idade != null ? 'atualizado há ' + fmtDur(usoDados.idade + (Date.now() - usoBuscadoEm) / 1000) : '');
  nota.id = 'uso-nota'; nota.dataset.idade = usoDados.idade;
  if (velho) nota.textContent += ' · abra uma sessão para atualizar';
  corpo.append(nota);
  aneis.title = dicas.join('\n') + (velho ? '\n(dado antigo: abra uma sessão para atualizar)' : '');
}
function tiqueUso() {  // atualiza so os textos de tempo, sem refazer o bloco
  if (!usoDados || !usoDados.disponivel) return;
  for (const l2 of document.querySelectorAll('#uso-corpo .l2')) { const v = textoZera(usoDados[l2.dataset.janela]); if (l2.textContent !== v) l2.textContent = v; }
  const nota = document.getElementById('uso-nota');
  if (nota && usoDados.idade != null) nota.textContent = 'atualizado há ' + fmtDur(usoDados.idade + (Date.now() - usoBuscadoEm) / 1000) + (usoDados.velho || (usoDados.idade + (Date.now() - usoBuscadoEm) / 1000) > 1800 ? ' · abra uma sessão para atualizar' : '');
}
async function buscarUso() {
  try {
    const r = await fetch('/api/uso', { cache: 'no-store' });
    if (r.ok) { usoDados = await r.json(); usoBuscadoEm = Date.now(); renderUso(); }
  } catch (_) { /* mantem o ultimo valor */ }
}
setInterval(buscarUso, 30000);
(function usoRecolhivel() {
  const caixa = document.getElementById('uso'), cab = document.getElementById('uso-cab');
  try { if (localStorage.getItem('mapa.usoRecolhido') === '1') { caixa.classList.add('recolhido'); cab.setAttribute('aria-expanded', 'false'); document.getElementById('uso-seta').textContent = '▸'; } } catch (_) { /* opcional */ }
  cab.addEventListener('click', () => {
    const rec = caixa.classList.toggle('recolhido');
    cab.setAttribute('aria-expanded', String(!rec));
    document.getElementById('uso-seta').textContent = rec ? '▸' : '▾';
    try { localStorage.setItem('mapa.usoRecolhido', rec ? '1' : '0'); } catch (_) { /* opcional */ }
  });
})();

// ---------- relogio e atualizacao periodica ----------
function tique() {
  const d = new Date();
  document.getElementById('relogio').textContent = d.toLocaleTimeString('pt-BR');
  const t = agora();
  for (const [s, e] of refsTempo) { const v = tempoDe(s, t); if (e.textContent !== v) e.textContent = v; }
  if (selecionada) { const s = sessoes.get(selecionada); if (s) atualizarDetalhe(false); atualizarTemposExtra(); }
  tiqueUso();
  for (const term of terminais.values()) atualizarStatusConversa(term);
  document.getElementById('conexao').classList.toggle('off', performance.now() - ultimoEstado > 8000 && ultimoEstado > 0);
}
setInterval(tique, 1000);

async function buscar() {
  try {
    const r = await fetch('/api/estado', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    aplicarEstado(await r.json());
    restaurarLayout();
    if (primeiroEnquadre) { primeiroEnquadre = false; enquadrar(); cam.x = alvo.x; cam.y = alvo.y; cam.k = alvo.k; }
  } catch (_) { /* a barra mostra "sem conexão" apos 8 s */ }
  setTimeout(buscar, document.hidden ? 10000 : 2000);
}
let primeiroEnquadre = true;

foco = lerFocoDaUrl();
sincronizarFoco();
buscarUso();
aoRedimensionar();
canvas.style.cursor = 'grab';
requestAnimationFrame(quadro);
buscar();
tique();
