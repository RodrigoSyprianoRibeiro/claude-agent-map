<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de agentes</title>
<link rel="icon" type="image/svg+xml" href="/static/icones/mapa-agentes.svg">
<link rel="icon" type="image/png" sizes="256x256" href="/static/icones/256.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icones/32.png">
<link rel="stylesheet" href="/static/vendor/xterm.css">
<style>
  :root {
    color-scheme: dark;
    --fundo: #05080f;
    --painel: rgba(10, 16, 28, 0.78);
    --borda: rgba(120, 160, 220, 0.18);
    --texto: #d7e2f3;
    --suave: #7f90ab;
    --atencao: #ff3b4f;
    --trabalhando: #ffb020;
    --suavez: #3ddc84;
    --fechada: #7b8494;
    --destaque: #5ad1ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fundo); color: var(--texto);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .vidro { background: var(--painel); border: 1px solid var(--borda); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border-radius: 10px; }

  #barra { position: fixed; top: 10px; left: 10px; right: 10px; height: 46px; display: flex; align-items: center;
    gap: 18px; padding: 0 14px; z-index: 5; }
  #barra .marca { font-weight: 600; letter-spacing: 0.22em; font-size: 11px; color: var(--suave); white-space: nowrap; }
  .contador { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; flex: none; }
  .contador .sim { font-size: 12px; }
  .contador b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .contador span.rot { color: var(--suave); font-size: 12px; }
  .c-atencao { color: var(--atencao); } .c-trabalhando { color: var(--trabalhando); } .c-suavez { color: var(--suavez); }
  .c-atencao.vivo b { animation: piscar 1s steps(2, jump-none) infinite; }
  @keyframes piscar { 50% { opacity: 0.35; } }
  #barra .espaco { flex: 1; }
  #barra > * { min-width: 0; }
  #barra .seg, #barra .bt, #barra .marca { flex: none; }
  #barra .ic-bt { display: inline-flex; align-items: center; gap: 6px; }
  #relogio { flex: none; font: 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--suave); font-variant-numeric: tabular-nums; }
  .seg { display: flex; gap: 0; } .seg .bt { border-radius: 0; margin-left: -1px; padding: 6px 10px; }
  .seg .bt:first-child { border-radius: 7px 0 0 7px; margin-left: 0; } .seg .bt:last-child { border-radius: 0 7px 7px 0; }
  .seg .bt.ativo { background: rgba(90,209,255,0.18); border-color: var(--destaque); color: #fff; position: relative; }
  #sel-proj, #sel-no { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
  #sel-proj { width: 168px; } #sel-no { width: 190px; }
  select.bt { border: 1px solid var(--borda); border-radius: 7px; padding: 6px 26px 6px 10px; font: inherit; outline: none; max-width: 210px; appearance: none; -webkit-appearance: none; background-color: rgba(14, 22, 38, 0.92); color: var(--texto);
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--suave) 50%), linear-gradient(135deg, var(--suave) 50%, transparent 50%);
    background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  select.bt:hover, select.bt:focus-visible, select.bt.ativo { border-color: var(--destaque); }
  select.bt option { background: #0a101c; color: var(--texto); }
  select.bt[hidden] { display: none; }
  #busca { width: 220px; min-width: 140px; background: rgba(255,255,255,0.05); border: 1px solid var(--borda); border-radius: 7px;
    color: var(--texto); padding: 6px 10px; font: inherit; outline: none; }
  #busca:focus { border-color: var(--destaque); box-shadow: 0 0 0 2px rgba(90,209,255,0.18); }
  button.bt { background: rgba(255,255,255,0.05); border: 1px solid var(--borda); border-radius: 7px; color: var(--texto);
    padding: 6px 11px; font: inherit; cursor: pointer; white-space: nowrap; }
  button.bt:hover { border-color: var(--destaque); }
  button.bt:focus-visible, #busca:focus-visible { outline: 2px solid var(--destaque); outline-offset: 1px; }
  #conexao { font-size: 11px; color: var(--atencao); display: none; }
  #conexao.off { display: block; }

  #lista { position: fixed; top: 66px; left: 10px; bottom: 54px; width: 300px; z-index: 4; display: flex; flex-direction: column;
    transition: transform 0.25s ease; }
  #lista.recolhida { transform: translateX(calc(-100% - 20px)); }
  #lista h2 { margin: 0; padding: 12px 14px 8px; font-size: 11px; letter-spacing: 0.2em; color: var(--suave); font-weight: 600; }
  #itens { overflow-y: auto; flex: 1; padding: 0 6px 8px; scrollbar-width: thin; scrollbar-color: #2a3a55 transparent; }
  .grupo { margin: 8px 8px 3px; font-size: 11px; color: var(--suave); text-transform: uppercase; letter-spacing: 0.1em; }
  .item { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left;
    background: none; border: 0; color: inherit; font: inherit; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
  .item:hover, .item.sel { background: rgba(255,255,255,0.07); }
  .item:focus-visible { outline: 2px solid var(--destaque); }
  .item .pt { width: 8px; height: 8px; border-radius: 50%; }
  .item .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .pj { display: block; font-size: 11px; color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .tp { font-size: 11px; color: var(--suave); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #alca { position: fixed; top: 74px; left: 318px; z-index: 4; width: 22px; height: 40px; padding: 0; transition: left 0.25s ease; }
  #alca.recolhida { left: 10px; }
  .vazio { color: var(--suave); padding: 14px; font-size: 12px; }

  #detalhe { position: fixed; top: 66px; right: 10px; bottom: 54px; width: 360px; z-index: 4; overflow-y: auto;
    padding: 16px; transform: translateX(calc(100% + 20px)); transition: transform 0.25s ease; scrollbar-width: thin;
    scrollbar-color: #2a3a55 transparent; }
  #detalhe.aberto { transform: none; }
  #detalhe .topo { display: flex; gap: 8px; align-items: start; }
  #detalhe h3 { margin: 0; font-size: 15px; flex: 1; word-break: break-word; }
  #detalhe .fechar { padding: 2px 8px; }
  .selo { display: inline-block; margin: 8px 0 2px; padding: 2px 9px; border-radius: 999px; font-size: 11px; border: 1px solid currentColor; }
  #detalhe dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0; }
  #detalhe dt { color: var(--suave); }
  #detalhe dd { margin: 0; word-break: break-word; }
  #detalhe .bloco { margin: 12px 0 4px; font-size: 11px; letter-spacing: 0.12em; color: var(--suave); text-transform: uppercase; }
  #detalhe .texto { background: rgba(255,255,255,0.04); border-radius: 7px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
  #detalhe a { color: var(--destaque); }
  .reserva { border: 1px dashed var(--borda); border-radius: 8px; padding: 14px; color: var(--suave); text-align: center; margin-top: 14px; }
  .arvore { margin: 4px 0 0 4px; }
  .sub { position: relative; padding: 6px 0 6px 18px; border-left: 1px solid var(--borda); }
  .sub::before { content: ""; position: absolute; left: 0; top: 17px; width: 12px; border-top: 1px solid var(--borda); }
  .sub:last-child { border-left-color: transparent; } .sub:last-child::after { content: ""; position: absolute; left: 0; top: 0; height: 17px; border-left: 1px solid var(--borda); }
  .sub .l1 { display: flex; gap: 7px; align-items: center; }
  .sub .pm { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .sub .tp { font-weight: 600; } .sub .ds { color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .sub .cs { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--suave); white-space: nowrap; }
  .sub .l2 { font-size: 11px; color: var(--suave); margin-top: 1px; word-break: break-word; }
  .st-rodando { color: var(--trabalhando); } .st-concluido { color: var(--suavez); } .st-parado { color: var(--fechada); }
  .barra-custo { display: grid; grid-template-columns: 1fr 74px; gap: 8px; align-items: center; margin: 3px 0; font-size: 12px; }
  .barra-custo .tr { height: 7px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; position: relative; }
  .barra-custo .pr { height: 100%; border-radius: 4px; }
  .barra-custo .nm { font-size: 11px; color: var(--suave); } .barra-custo .vl { text-align: right; font-variant-numeric: tabular-nums; }
  .linha-tempo { max-height: 260px; overflow-y: auto; font-size: 12px; scrollbar-width: thin; scrollbar-color: #2a3a55 transparent; }
  .linha-tempo div { display: grid; grid-template-columns: 54px auto 1fr; gap: 8px; padding: 1px 0; }
  .linha-tempo .h { color: var(--suave); font-variant-numeric: tabular-nums; } .linha-tempo .f { color: var(--destaque); } .linha-tempo .r { color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nota { font-size: 11px; color: var(--suave); margin-top: 3px; }
  .acao { display: inline-block; margin-top: 12px; text-decoration: none; }

  #legenda { position: fixed; left: 10px; bottom: 10px; right: 10px; z-index: 3; display: flex; gap: 16px; align-items: center;
    padding: 8px 14px; font-size: 11px; color: var(--suave); pointer-events: none; }
  #legenda i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  #legenda .espaco { flex: 1; }
  #dica { position: fixed; z-index: 6; pointer-events: none; padding: 6px 10px; max-width: 320px; display: none; font-size: 12px; }
  #dica small { color: var(--suave); display: block; }
  /* uso do plano */
  #uso { margin: 0 8px 4px; padding: 8px 10px 9px; border: 1px solid var(--borda); border-radius: 9px; background: rgba(255,255,255,0.03); }
  #uso-cab { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: 0; color: var(--suave); font: 600 11px/1 system-ui, sans-serif;
    letter-spacing: 0.16em; cursor: pointer; padding: 0 0 6px; text-transform: uppercase; }
  #uso.recolhido #uso-cab { padding-bottom: 0; }
  #uso.recolhido #uso-corpo { display: none; }
  .uso-linha { margin-top: 7px; }
  .uso-linha .l1 { display: flex; justify-content: space-between; font-size: 12px; }
  .uso-linha .l1 b { font-variant-numeric: tabular-nums; }
  .uso-barra { height: 6px; border-radius: 4px; background: rgba(255,255,255,0.07); overflow: hidden; margin: 4px 0 2px; }
  .uso-barra i { display: block; height: 100%; border-radius: 4px; transition: width 0.4s ease; }
  .uso-linha .l2, #uso-nota { font-size: 11px; color: var(--suave); }
  #uso-nota { margin-top: 7px; }
  #uso-aneis { display: inline-flex; gap: 5px; align-items: center; flex: none; cursor: default; }
  #uso-aneis[hidden] { display: none; }
  #uso-aneis svg { display: block; }
  .grupo-nova { display: inline-flex; flex: none; }
  .grupo-nova .bt:first-child { border-radius: 7px 0 0 7px; }
  .grupo-nova .bt + .bt { border-radius: 0 7px 7px 0; margin-left: -1px; padding: 6px 7px; }
  #popover-proj { position: fixed; z-index: 15; width: 260px; max-height: 60vh; overflow-y: auto; padding: 6px; }
  #popover-proj[hidden] { display: none; }
  #popover-proj .reg { margin: 6px 8px 2px; font-size: 10.5px; letter-spacing: 0.14em; color: var(--suave); text-transform: uppercase; }
  #popover-proj button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--texto); font: inherit; padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  #popover-proj button:hover { background: rgba(255,255,255,0.08); }
  :root { --doca-px: 0px; }
  #lista, #detalhe { bottom: calc(54px + var(--doca-px)); }
  #doca { position: fixed; left: 0; right: 0; bottom: 0; height: 320px; z-index: 8; background: #070b14; border-top: 1px solid var(--borda);
    display: flex; flex-direction: column; box-shadow: 0 -12px 32px rgba(0,0,0,0.45); }
  #doca[hidden] { display: none; }
  #doca-borda { position: absolute; left: 0; right: 0; top: -4px; height: 8px; cursor: ns-resize; z-index: 2; }
  #doca-borda:hover { background: rgba(90,209,255,0.25); }
  .col-barra { box-sizing: border-box; min-height: 42px; display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: rgba(14, 22, 38, 0.95); border-bottom: 1px solid var(--borda); }
  .col-abas { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; align-self: stretch; align-items: center; }
  #doca-acoes { display: flex; gap: 6px; flex: none; }
  .col-dividir { padding: 3px 7px; display: inline-flex; align-items: center; }
  .col-dividir svg { display: block; }
  #doca-colunas { flex: 1; min-height: 0; display: flex; overflow-x: auto; }
  .coluna { flex: 1 1 0; min-width: 320px; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .divisor { flex: none; width: 5px; cursor: col-resize; background: linear-gradient(var(--borda), var(--borda)) center / 1px 100% no-repeat; z-index: 2; }
  .divisor:hover, .divisor.arrastando { background: rgba(90,209,255,0.35); }
  #doca-colunas.multi .coluna.col-ativa::after { content: ''; position: absolute; inset: 0; border: 1px solid rgba(90,209,255,0.5); pointer-events: none; z-index: 3; }
  .aba.arrastada { opacity: 0.4; }
  .marca-solta { position: fixed; z-index: 30; width: 3px; background: var(--destaque); border-radius: 2px; pointer-events: none; display: none; }
  .zona-solta { position: fixed; z-index: 30; background: rgba(90,209,255,0.16); border: 2px solid var(--destaque); border-radius: 8px; pointer-events: none; display: none; }
  @media (max-width: 899px) {  /* tela estreita: as colunas empilham */
    #doca-colunas { flex-direction: column; overflow-x: hidden; }
    .coluna { min-width: 0; min-height: 120px; }
    .divisor { display: none; }
  }
  .aba { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border: 1px solid var(--borda); border-radius: 7px;
    background: rgba(255,255,255,0.04); color: var(--suave); cursor: pointer; white-space: nowrap; font: inherit; }
  .aba.ativa { color: var(--texto); border-color: var(--destaque); background: rgba(90,209,255,0.12); }
  .aba.desanexada { opacity: 0.6; font-style: italic; }
  .aba .x { background: none; border: 0; color: inherit; cursor: pointer; padding: 0 5px; font: inherit; border-radius: 4px; }
  .aba .x:hover { background: rgba(255,255,255,0.12); }
  .col-corpo { flex: 1; position: relative; min-height: 0; }
  .term { position: absolute; inset: 6px 8px 8px; display: none; flex-direction: column; gap: 8px; }
  .term.ativa { display: flex; }
  .vista { flex: 1; min-height: 0; position: relative; }
  .term-x { position: absolute; inset: 0; }
  .term-x .xterm { height: 100%; }
  /* modo conversa: o xterm continua montado e com tamanho (o attach e a leitura da tela dependem dele), so invisivel */
  .term:not(.modo-terminal) .term-x { visibility: hidden; pointer-events: none; }
  .term.modo-terminal .conversa { display: none; }
  .modo-seg { position: absolute; top: 6px; right: 14px; z-index: 4; display: flex; background: rgba(10,16,28,0.92); border: 1px solid var(--borda); border-radius: 8px; padding: 2px; }
  .modo-seg button { background: none; border: 0; color: var(--suave); font: 12px system-ui, sans-serif; padding: 3px 10px; border-radius: 6px; cursor: pointer; }
  .modo-seg button.ativo { background: rgba(90,209,255,0.16); color: var(--texto); }
  .modo-seg button:focus-visible { outline: 2px solid var(--destaque); }
  .term.modo-terminal .modo-seg { opacity: 0.5; } .term.modo-terminal .modo-seg:hover { opacity: 1; }

  /* ---- conversa (estilo da extensao do VSCode) ---- */
  .conversa { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a3a55 transparent; }
  .conv-col { max-width: 880px; margin: 0 auto; padding: 14px 18px 8px; font: 13.5px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); }
  .conv-topo { text-align: center; margin-bottom: 10px; }
  .conv-topo[hidden] { display: none; }
  .conv-vazio { color: var(--suave); text-align: center; padding: 30px 0; }
  .conv-lista > * { margin: 0 0 10px; }
  .msg-u { position: relative; background: rgba(255,255,255,0.055); border: 1px solid var(--borda); border-radius: 10px; padding: 8px 12px; margin-top: 18px !important; }
  .msg-u-tx { white-space: pre-wrap; word-break: break-word; }
  .msg-u.fantasma { opacity: 0.55; border-style: dashed; }
  .chip { display: inline-block; margin-top: 6px; padding: 1px 8px; border-radius: 999px; font-size: 11px; color: var(--suave); border: 1px solid var(--borda); }
  .msg-a { position: relative; }
  .msg-acoes { position: absolute; top: -4px; right: 0; display: none; gap: 4px; }
  .msg-u:hover .msg-acoes, .msg-a:hover .msg-acoes { display: flex; }
  .bt-mini { background: rgba(14,22,38,0.95); border: 1px solid var(--borda); color: var(--suave); border-radius: 6px; font: 11px system-ui, sans-serif; padding: 2px 8px; cursor: pointer; }
  .bt-mini:hover { color: var(--texto); border-color: var(--destaque); }
  .md { word-break: break-word; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 14px 0 6px; line-height: 1.3; } .md h1 { font-size: 17px; } .md h2 { font-size: 15.5px; } .md h3, .md h4 { font-size: 14px; }
  .md ul, .md ol { margin: 4px 0 8px; padding-left: 22px; } .md li { margin: 2px 0; }
  .md a { color: var(--destaque); }
  .md code { font: 12.5px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; background: rgba(255,255,255,0.07); padding: 1px 5px; border-radius: 4px; }
  .md pre code { background: none; padding: 0; }
  .bloco-cod { position: relative; margin: 6px 0 10px; }
  .bloco-cod pre, pre.cod { margin: 0; background: #0b1220; border: 1px solid var(--borda); border-radius: 8px; padding: 9px 12px; overflow-x: auto;
    font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; white-space: pre; scrollbar-width: thin; }
  .bloco-cod .bt-mini { position: absolute; top: 5px; right: 6px; opacity: 0; }
  .bloco-cod:hover .bt-mini { opacity: 1; }
  .md table { border-collapse: collapse; margin: 6px 0 10px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--borda); padding: 4px 9px; text-align: left; vertical-align: top; }
  .md th { background: rgba(255,255,255,0.05); }
  .md blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--borda); color: var(--suave); }
  .md hr { border: 0; border-top: 1px solid var(--borda); margin: 12px 0; }
  .ferr { font-size: 12.5px; }
  .ferr + .ferr { margin-top: -6px !important; }
  .ferr-cab { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; color: var(--texto); font: inherit; text-align: left; padding: 3px 0; cursor: pointer; }
  .ferr-cab:hover b { color: var(--destaque); }
  .ferr-pt { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--fechada); }
  .ferr.ok .ferr-pt { background: var(--suavez); } .ferr.erro .ferr-pt { background: var(--atencao); }
  .term.trabalhando .ferr.pendente .ferr-pt { background: var(--trabalhando); animation: piscar 1s ease-in-out infinite; }
  .ferr-cab b { font-weight: 600; flex: none; }
  .ferr-rs { color: var(--suave); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ferr-corpo { margin: 4px 0 6px 16px; border: 1px solid var(--borda); border-radius: 8px; overflow: hidden; }
  .ferr-linha { display: grid; grid-template-columns: 38px 1fr; border-top: 1px solid var(--borda); }
  .ferr-linha:first-child { border-top: 0; }
  .ferr-linha > span { padding: 7px 0 0 9px; font-size: 10.5px; letter-spacing: 0.08em; color: var(--suave); }
  .ferr-linha pre { margin: 0; padding: 7px 10px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; scrollbar-width: thin; }
  .ferr-linha.erro pre { color: #ffb3bb; }
  .diff { margin: 0; padding: 6px 0; max-height: 260px; overflow: auto; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; scrollbar-width: thin; }
  .diff div { white-space: pre-wrap; word-break: break-word; padding: 0 10px; }
  .diff .rem { background: rgba(255,59,79,0.13); color: #ffc2c8; } .diff .add { background: rgba(61,220,132,0.12); color: #bff5d5; }

<script>
'use strict';
const TOKEN = '__TOKEN__';
const JANELA_DIAS = 14;
const COR = {
  atencao: [255, 59, 79], trabalhando: [255, 176, 32], suaVez: [61, 220, 132], fechada: [123, 132, 148],
};
const COR_REGIAO = {};  // workspaces: cor do config.json (registrarRegioes); avulsos: derivada do nome
function corDaRegiao(id) {  // projeto avulso: matiz estavel derivado do nome
  if (COR_REGIAO[id]) return COR_REGIAO[id];
  const h = (hash(id) % 360) / 360, s = 0.55, l = 0.6;
  const q = l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 0.5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return (COR_REGIAO[id] = [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255]);
}
const NOME_COLUNA = { atencao: 'precisa de você', trabalhando: 'trabalhando', suaVez: 'sua vez', fechada: 'fechada' };
const ORDEM_COLUNA = { atencao: 0, trabalhando: 1, suaVez: 2, fechada: 3 };

const reduzMovimento = matchMedia('(prefers-reduced-motion: reduce)');
let escalaMovimento = reduzMovimento.matches ? 0.15 : 1;
reduzMovimento.addEventListener?.('change', e => { escalaMovimento = e.matches ? 0.15 : 1; });

const canvas = document.getElementById('mapa');
const ctx = canvas.getContext('2d', { alpha: false });
let L = 0, A = 0, dpr = 1;

// ---------- estado ----------
const nos = new Map();       // id -> no
const sessoes = new Map();   // id -> sessao (com estado de animacao)
let regioes = [];
let ordemDesenho = [];
let primeiraCarga = true;
let ultimoEstado = 0;
let selecionada = null;      // id
let seguindo = null;         // id que a camera acompanha
let hover = null;            // sessao
let hoverNo = null;
let noSel = null;   // no selecionado no mapa (clique no no, ou no da sessao selecionada)
let padraoNovaSessao = { modelo: 'opus', esforco: 'high' };  // "+ sessao" instantaneo (testes trocam para haiku/low)
let busca = '';
const NOME_REGIAO = {};  // workspaces: nome do config.json
const nomeDaRegiao = id => NOME_REGIAO[id] || id;
let grandes = [];  // ids dos workspaces, na ordem do config: botoes de foco e atalhos 2..9
// workspaces vem do servidor: botao de foco, nome e cor de cada um (refeito so quando a lista muda)
function registrarRegioes(lista) {
  const ws = (lista || []).filter(r => r.grande);
  const ass = ws.map(r => r.id + '|' + r.rotulo + '|' + r.cor).join(',');
  if (ass === registrarRegioes.ass) return;
  registrarRegioes.ass = ass;
  grandes = ws.map(r => r.id);
  for (const r of ws) {
    NOME_REGIAO[r.id] = r.rotulo || r.id;
    const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(r.cor || '');
    if (m) COR_REGIAO[r.id] = [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
  }
  const seg = document.getElementById('seg-foco');
  for (const b of seg.querySelectorAll('.bt[data-foco]:not([data-foco=""])')) b.remove();
  ws.forEach((r, i) => {
    const b = el('button', 'bt', NOME_REGIAO[r.id]);
    b.dataset.foco = r.id;
    if (i < 8) b.title = NOME_REGIAO[r.id] + ' (' + (i + 2) + ')';
    b.addEventListener('click', () => definirFoco(r.id));
    seg.append(b);
  });
  sincronizarFoco(false);
}
let noFoco = null;  // no em destaque: o do foco ou o unico no do projeto avulso em foco
let foco = { regiao: null, no: null };  // no = id completo ("empresa/portal")
let dados = null;                       // ultimo estado recebido, sem filtro
let todosNos = [];                      // todos os nos, para o seletor de projeto

function lerFocoDaUrl() {
  const v = new URLSearchParams(location.search).get('foco') || '';
  const i = v.indexOf('/');
  const regiao = i < 0 ? v : v.slice(0, i);
  if (!regiao) return { regiao: null, no: null };
  return { regiao, no: i < 0 || i === v.length - 1 ? null : v };
}
function valorFoco(f) { return f.no || f.regiao || ''; }
function tituloFoco() {
  if (!foco.regiao) return 'Mapa';
  const nome = foco.no ? foco.no.slice(foco.no.indexOf('/') + 1) : '';
  return 'Mapa · ' + nomeDaRegiao(foco.regiao) + (nome ? ' / ' + nome : '');
}

const cam = { x: 0, y: 0, k: 0.3 };
const alvo = { x: 0, y: 0, k: 0.3 };
let arrasto = null;
let poligonos = 0;

function el(tag, classe, texto) {
  const e = document.createElement(tag);
  if (classe) e.className = classe;
  if (texto != null) e.textContent = texto;
  return e;
}
const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
const lerp = (a, b, t) => a + (b - a) * t;
const limitar = (v, a, b) => Math.max(a, Math.min(b, v));

function hash(texto) {
  let h = 2166136261;
  for (let i = 0; i < texto.length; i++) { h ^= texto.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13;
  return h >>> 0;
}

function agora() { return Date.now() / 1000; }

function fmtDur(seg) {
  seg = Math.max(0, Math.round(seg));
  if (seg < 60) return seg + ' s';
  if (seg < 3600) return Math.floor(seg / 60) + ' min';
  if (seg < 86400) {
    const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60);
    return h + ' h' + (m ? ' ' + m + ' min' : '');
  }
  const d = Math.floor(seg / 86400), h = Math.floor((seg % 86400) / 3600);
  return d + ' d' + (h ? ' ' + h + ' h' : '');
}
function fmtData(t) {
  if (!t) return '—';
  return new Date(t * 1000).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function tituloCurto(s, max) {
  const t = (s.titulo || s.nome || s.primeiroPrompt || s.id.slice(0, 8)).replace(/\s+/g, ' ');
  return t.length > max ? t.slice(0, max - 1) + '…' : t;
}
function tempoDe(s, t) {
  switch (s.coluna) {
    case 'atencao': {
      let ts = s.atencao && s.atencao.ts;
      if (ts > 1e12) ts /= 1000;
      return ts ? 'aguardando há ' + fmtDur(t - ts) : 'aguardando você';
    }
    case 'trabalhando':
      // nunca usa inicioSessao: sem prompt achado, so o inicio aproximado (janela lida) e "mais de X"
      if (s.inicioTurno) return 'rodando há ' + fmtDur(t - s.inicioTurno);
      return s.inicioTurnoAproximado ? 'rodando há mais de ' + fmtDur(t - s.inicioTurnoAproximado) : 'rodando';
    case 'suaVez': {
      const fim = s.fimTurno || s.ultimaAtividade;
      return fim ? 'terminou há ' + fmtDur(t - fim) : 'terminou';
    }
    default:
      return s.ultimaAtividade ? 'fechada há ' + fmtDur(t - s.ultimaAtividade) : 'fechada';
  }
}

// ---------- fundo: estrelas e grade ----------
const estrelas = [];
(function gerarEstrelas() {
  let x = 12345;
  const rnd = () => { x = (Math.imul(x, 1664525) + 1013904223) >>> 0; return x / 4294967296; };
  for (let i = 0; i < 190; i++) {
    const camada = rnd() < 0.6 ? 0 : (rnd() < 0.6 ? 1 : 2);
    estrelas.push({ x: rnd(), y: rnd(), camada, r: 0.4 + camada * 0.45 + rnd() * 0.4, a: 0.25 + rnd() * 0.55, f: rnd() * 6.28 });
  }
})();

// ---------- brilhos pre-renderizados ----------
const brilhos = {};
function brilho(cor) {
  const chave = cor.join(',');
  if (brilhos[chave]) return brilhos[chave];
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, rgba(cor, 0.95));
  grad.addColorStop(0.2, rgba(cor, 0.42));
  grad.addColorStop(0.55, rgba(cor, 0.1));
  grad.addColorStop(1, rgba(cor, 0));
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return (brilhos[chave] = c);
}
function desenharBrilho(cor, x, y, raio, alfa) {
  if (alfa <= 0.01) return;
  ctx.globalAlpha = Math.min(1, alfa);
  ctx.drawImage(brilho(cor), x - raio, y - raio, raio * 2, raio * 2);
  ctx.globalAlpha = 1;
}

// ---------- camera ----------
function escalaVisual() { return limitar(Math.pow(cam.k, 0.6), 0.28, 3.2); }
function paraTela(wx, wy) { return [(wx - cam.x) * cam.k + L / 2, (wy - cam.y) * cam.k + A / 2]; }
function paraMundo(sx, sy) { return [(sx - L / 2) / cam.k + cam.x, (sy - A / 2) / cam.k + cam.y]; }

function docaPx() { return document.body.classList.contains('doca-aberta') ? parseInt(getComputedStyle(document.documentElement).getPropertyValue('--doca-px')) || 0 : 0; }

function enquadrarNo(n) {
  // tamanhos visuais escalam com k^0.6; o maior raio de orbita (mundo, em unidades de tamanho) cabe na area util
  const esq = document.getElementById('lista').classList.contains('recolhida') ? 0 : 320;
  const dir = document.getElementById('detalhe').classList.contains('aberto') ? 380 : 0;
  const util = Math.min(L - esq - dir - 80, A - 200 - docaPx()) / 2;
  let rmax = raioNo(n) + 40;
  for (const s of sessoes.values()) if (s.no === n.id) rmax = Math.max(rmax, raioOrbita(s, n) + 40);
  const ks = util / rmax;
  alvo.k = limitar(Math.pow(ks, 1 / 0.6), 0.1, 4);
  alvo.x = n.x - (esq - dir) / 2 / alvo.k;
  alvo.y = n.y - (60 / 2) / alvo.k;
  seguindo = null;
}

function enquadrar(lista) {
  if (!lista && noFoco && nos.has(noFoco)) { enquadrarNo(nos.get(noFoco)); return; }
  let a = lista;
  if (!a || !a.length) {
    a = regioes.filter(r => [...nos.values()].some(n => n.regiao === r.id));
    if (!a.length) a = regioes;
  }
  if (!a.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const r of a) {
    x0 = Math.min(x0, r.x - r.raio); x1 = Math.max(x1, r.x + r.raio);
    y0 = Math.min(y0, r.y - r.raio); y1 = Math.max(y1, r.y + r.raio);
  }
  const larg = Math.max(1, x1 - x0), alt = Math.max(1, y1 - y0);
  // margens em pixels: barra superior + titulo da regiao (acima do contorno), legenda embaixo,
  // lista (esquerda) e detalhe (direita) quando abertos
  const esq = document.getElementById('lista').classList.contains('recolhida') ? 0 : 320;
  const dir = document.getElementById('detalhe').classList.contains('aberto') ? 380 : 0;
  const topo = 120, base = 60 + docaPx(), lado = 40;
  const k = limitar(Math.min((L - esq - dir - 2 * lado) / larg, (A - topo - base) / alt), 0.05, 4);
  alvo.k = k;
  alvo.x = (x0 + x1) / 2 - (esq - dir) / 2 / k;
  alvo.y = (y0 + y1) / 2 - (topo - base) / 2 / k;
  seguindo = null;
}

// ---------- dados ----------
function novaSessao(d, t, animar) {
  const h = hash(d.id), h2 = hash(d.id + 'orb');
  return {
    id: d.id, h, nascimento: t, animarNascimento: animar,
    ang: (h % 6283) / 1000, dir: (h2 & 1) ? 1 : -1, vel: 0.05 + ((h2 >>> 3) % 50) / 600,
    banda: h2 >>> 8, fase: (h % 628) / 100,
    cor: COR[d.coluna === 'atencao' ? 'atencao' : d.coluna === 'trabalhando' ? 'trabalhando' : d.coluna === 'suaVez' ? 'suaVez' : 'fechada'].slice(),
    vivacidade: d.aberta ? 1 : 0, pulso: animar ? t : 0, sx: 0, sy: 0, sr: 4, alfa: 1, rotulo: '', rotuloEm: 0,
    ...d,
  };
}

function noNoFoco(n) {
  return !foco.regiao || (foco.no ? n.id === foco.no : n.regiao === foco.regiao);
}

function aplicarEstado(est) {
  const t = agora();
  dados = est;
  registrarRegioes(est.regioes);
  todosNos = est.nos || [];
  // regiao do foco que nao existe mais (projeto antigo demais): volta para Tudo
  if (foco.regiao && !(est.regioes || []).some(r => r.id === foco.regiao)) { foco = { regiao: null, no: null }; sincronizarFoco(false); }
  // foco num no que sumiu (ex.: so fechadas antigas): volta para a regiao
  if (foco.no && !todosNos.some(n => n.id === foco.no)) { foco.no = null; sincronizarFoco(false); }
  // o filtro REMOVE da tela regioes, nos e sessoes fora do foco (nao so esmaece)
  const nosDaRegiao = todosNos.filter(n => n.regiao === foco.regiao);
  noFoco = foco.no || (foco.regiao && nosDaRegiao.length === 1 ? nosDaRegiao[0].id : null);
  regioes = (est.regioes || []).filter(r => !foco.regiao || (!foco.no && r.id === foco.regiao));
  const vistos = new Set();
  for (const n of (est.nos || []).filter(noNoFoco)) {
    vistos.add(n.id);
    const ant = nos.get(n.id);
    if (ant) {
      ant.total = n.total; ant.abertas = n.abertas; ant.nome = n.nome; ant.regiao = n.regiao; ant.mult = noFoco === n.id ? 1.8 : 1;
      if (!(arrasto && arrasto.tipo === 'no' && arrasto.no === ant)) { ant.x = n.x; ant.y = n.y; }
    } else {
      nos.set(n.id, { ...n, nascimento: t, colunas: {}, mult: noFoco === n.id ? 1.8 : 1 });
    }
  }
  for (const id of [...nos.keys()]) if (!vistos.has(id)) nos.delete(id);

  const idsSess = new Set();
  for (const d of est.sessoes || []) {
    if (!nos.has(d.no)) continue;
    idsSess.add(d.id);
    const ant = sessoes.get(d.id);
    if (ant) {
      if (ant.coluna !== d.coluna) ant.pulso = t;
      Object.assign(ant, d);
    } else {
      sessoes.set(d.id, novaSessao(d, t, !primeiraCarga));
    }
  }
  for (const id of [...sessoes.keys()]) if (!idsSess.has(id)) { sessoes.delete(id); if (selecionada === id) fecharDetalhe(); }

  const q = busca.trim().toLowerCase();
  for (const s of sessoes.values()) {
    s.alvoCor = COR[s.coluna] || COR.fechada;
    s.hay = [s.titulo, s.nome, s.projeto, s.subprojeto, s.primeiroPrompt, s.ultimoPrompt, s.no].join(' ').toLowerCase();
  }
  ordemDesenho = [...sessoes.values()].sort((a, b) => ORDEM_COLUNA[b.coluna] - ORDEM_COLUNA[a.coluna]);
  aplicarBusca(q);
  primeiraCarga = false;
  ultimoEstado = performance.now();
  if (selecionada && !sessoes.has(selecionada)) fecharDetalhe();
  atualizarContadores();
  atualizarSeletores();
  atualizarLista();
  if (selecionada) atualizarDetalhe(false);
}

function aplicarBusca(q) {
  for (const s of sessoes.values()) s.casa = !q || s.hay.includes(q);
  for (const n of nos.values()) {
    n.casa = !q || n.nome.toLowerCase().includes(q) || [...sessoes.values()].some(s => s.no === n.id && s.casa);
  }
}

// ---------- geometria das sessoes ----------
function raioNo(n) { return (17 + 6 * Math.log2(1 + (n.total || 1))) * (n.mult || 1); }
function raioOrbita(s, n) {
  const base = raioNo(n);
  const m = n.mult || 1;
  return s.aberta ? base + (20 + (s.banda % 3) * 10) * m : base + (48 + (s.banda % 4) * 9) * m;
}

// ---------- desenho ----------
let tAnim = 0;
function desenharFundo(t) {
  ctx.fillStyle = '#05080f';
  ctx.fillRect(0, 0, L, A);
  const g = ctx.createRadialGradient(L * 0.5, A * 0.45, 0, L * 0.5, A * 0.45, Math.max(L, A) * 0.75);
  g.addColorStop(0, 'rgba(18, 32, 60, 0.55)');
  g.addColorStop(1, 'rgba(5, 8, 15, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, L, A);

  // grade em coordenadas do mundo, some quando fica densa demais
  let passo = 160;
  while (passo * cam.k < 34) passo *= 2;
  const fade = limitar((passo * cam.k - 34) / 40, 0, 1) * 0.07 + 0.025;
  ctx.strokeStyle = 'rgba(110, 150, 220,' + fade + ')';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const [mx0, my0] = paraMundo(0, 0), [mx1, my1] = paraMundo(L, A);
  for (let x = Math.floor(mx0 / passo) * passo; x <= mx1; x += passo) {
    const sx = Math.round((x - cam.x) * cam.k + L / 2) + 0.5;
    ctx.moveTo(sx, 0); ctx.lineTo(sx, A);
  }
  for (let y = Math.floor(my0 / passo) * passo; y <= my1; y += passo) {
    const sy = Math.round((y - cam.y) * cam.k + A / 2) + 0.5;
    ctx.moveTo(0, sy); ctx.lineTo(L, sy);
  }
  ctx.stroke();

  // estrelas com paralaxe (3 camadas)
  const par = [0.05, 0.12, 0.22];
  for (const e of estrelas) {
    const f = par[e.camada];
    let sx = (e.x * L - cam.x * cam.k * f) % L; if (sx < 0) sx += L;
    let sy = (e.y * A - cam.y * cam.k * f) % A; if (sy < 0) sy += A;
    const cintila = escalaMovimento < 1 ? 1 : 0.75 + 0.25 * Math.sin(t * 1.3 + e.f);
    ctx.fillStyle = 'rgba(190, 215, 255,' + (e.a * cintila) + ')';
    ctx.fillRect(sx, sy, e.r, e.r);
  }
}

function textoEspacado(txt, x, y, espaco) {
  if ('letterSpacing' in ctx) {
    ctx.letterSpacing = espaco + 'px';
    ctx.fillText(txt, x + espaco / 2, y);
    ctx.letterSpacing = '0px';
  } else {
    ctx.fillText(txt.split('').join(' '), x, y);
  }
}

function desenharRegioes(t) {
  for (const r of regioes) {
    if (!r.contorno) continue;  // projeto avulso de um no so: nada de contorno de grupo
    const cor = corDaRegiao(r.id);
    const [sx, sy] = paraTela(r.x, r.y);
    const R = r.raio * cam.k;
    if (sx + R < 0 || sx - R > L || sy + R < 0 || sy - R > A) continue;
    const g = ctx.createRadialGradient(sx, sy, R * 0.1, sx, sy, R);
    g.addColorStop(0, rgba(cor, 0.07));
    g.addColorStop(0.8, rgba(cor, 0.035));
    g.addColorStop(1, rgba(cor, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, 6.2832); ctx.fill();
    ctx.setLineDash([2, 9]);
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = rgba(cor, 0.3);
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, 6.2832); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = rgba(cor, 0.62);
    ctx.font = '600 ' + limitar(15 + Math.log2(Math.max(cam.k, 0.1) * 4) * 3, 12, 30) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    textoEspacado(r.nome.toUpperCase(), sx, sy - R - 10, 9);
  }
}

function corPulsante(s, t) {
  // fator de brilho/opacidade por coluna
  if (s.coluna === 'atencao') {
    if (escalaMovimento < 1) return 1;
    const v = Math.sin(t * 7 + s.fase);
    return 0.55 + 0.45 * (v > 0 ? 1 : 0.15 + 0.85 * (v + 1));  // pisca forte
  }
  if (s.coluna === 'trabalhando') return escalaMovimento < 1 ? 0.9 : 0.78 + 0.22 * Math.sin(t * 3.2 + s.fase);
  return 1;
}

function desenharNos(t, ks) {
  ocupados.length = 0;
  etiquetasNo.length = 0;
  for (const n of nos.values()) {
    const [sx, sy] = paraTela(n.x, n.y);
    const rn = raioNo(n) * ks;
    n.sx = sx; n.sy = sy; n.sr = rn;
    if (sx < -300 || sx > L + 300 || sy < -300 || sy > A + 300) { n.fora = true; continue; }
    n.fora = false;
    const cont = { atencao: 0, trabalhando: 0, suaVez: 0 };
    for (const s of sessoes.values()) if (s.no === n.id && cont[s.coluna] != null) cont[s.coluna]++;
    n.cont = cont;
    const cor = corDaRegiao(n.regiao);
    const dim = n.casa ? 1 : 0.22;
    ctx.globalAlpha = dim;

    // rastros de orbita
    ctx.lineWidth = 1;
    ctx.strokeStyle = rgba(cor, 0.07);
    const raios = new Set();
    for (const s of sessoes.values()) if (s.no === n.id) raios.add(Math.round(raioOrbita(s, n)));
    ctx.beginPath();
    for (const r of raios) { ctx.moveTo(sx + r * ks, sy); ctx.arc(sx, sy, r * ks, 0, 6.2832); }
    ctx.stroke();

    let halo = null, intens = 0;
    if (cont.atencao) { halo = COR.atencao; intens = 0.55 + (escalaMovimento < 1 ? 0.2 : 0.3 * Math.sin(t * 5)); }
    else if (cont.trabalhando) { halo = COR.trabalhando; intens = 0.32 + (escalaMovimento < 1 ? 0 : 0.1 * Math.sin(t * 2.4)); }
    else if (cont.suaVez) { halo = COR.suaVez; intens = 0.2; }
    desenharBrilho(halo || cor, sx, sy, rn * 3.4, halo ? intens : 0.2);

    const g = ctx.createRadialGradient(sx - rn * 0.3, sy - rn * 0.35, rn * 0.1, sx, sy, rn);
    g.addColorStop(0, rgba(cor, 0.5));
    g.addColorStop(1, 'rgba(8, 14, 26, 0.95)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, rn, 0, 6.2832); ctx.fill();
    ctx.lineWidth = Math.max(1.5, 2.2 * ks);
    ctx.strokeStyle = rgba(halo || cor, halo ? 0.95 : 0.75);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.strokeStyle = rgba(cor, 0.35);
    ctx.beginPath(); ctx.arc(sx, sy, rn + 4 * ks + 2, 0, 6.2832); ctx.stroke();
    if (n.id === noSel) { ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.4; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(sx, sy, rn + 12 * ks + 5, 0, 6.2832); ctx.stroke(); ctx.setLineDash([]); }
    if (hoverNo === n) { ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(sx, sy, rn + 8 * ks + 3, 0, 6.2832); ctx.stroke(); }

    // anel vivo para quem tem sessao aberta: arco girando na cor do estado mais urgente
    if (n.abertas) {
      const corViva = halo || COR.suaVez;
      const giro = escalaMovimento < 1 ? 0 : t * 0.9;
      ctx.lineWidth = Math.max(2, 3 * ks);
      ctx.strokeStyle = rgba(corViva, 0.9);
      ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.arc(sx, sy, rn + 7 * ks + 4, giro + i * 2.0944, giro + i * 2.0944 + 1.0); ctx.stroke();
      }
      ctx.lineCap = 'butt';
    }
    ctx.globalAlpha = 1;
    // o corpo do no ocupa espaco: etiquetas de outros nos nao podem cobri-lo
    const rc = rn + 3 * ks + 2;
    ocupados.push([sx - rc, sy - rc, sx + rc, sy + rc]);
    etiquetasNo.push({ n, dim, rn, prio: n.id === noFoco || hoverNo === n ? -1
      : cont.atencao ? 0 : cont.trabalhando ? 1 : cont.suaVez ? 2 : 3 });
  }
}

const ocupados = [];     // retangulos de tela ja usados neste quadro: [x0, y0, x1, y1]
const etiquetasNo = [];
function colide(r) {
  for (const o of ocupados) if (r[0] < o[2] && r[2] > o[0] && r[1] < o[3] && r[3] > o[1]) return true;
  return false;
}
function encurtar(txt, max) { return txt.length > max ? txt.slice(0, Math.max(3, max - 1)) + '…' : txt; }

// Etiquetas dos nos por prioridade (atencao > trabalhando > sua vez > mais sessoes > alfabetica).
// Colidiu: tenta o nome encurtado; so depois esconde. Fonte nunca abaixo de 11 px.
let escondidas = 0;
function desenharEtiquetasNo(ks) {
  etiquetasNo.sort((a, b) => a.prio - b.prio || (b.n.total - a.n.total) || a.n.nome.localeCompare(b.n.nome));
  const fonte = limitar(11 + ks * 2.2, 11, 16);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.lineJoin = 'round';
  escondidas = 0;
  for (const e of etiquetasNo) {
    const { n, rn, dim } = e;
    const forcado = e.prio === -1;
    const yAbaixo = n.sy + rn + 10 * ks + 8;
    const yAcima = n.sy - rn - 10 * ks - 6 - fonte * 2 - 4;
    let y = yAbaixo;
    ctx.font = '600 ' + fonte + 'px system-ui, sans-serif';
    const contTxt = n.abertas + '/' + n.total;
    let achou = null;
    for (const max of [99, 16, 10]) {
      const nome = encurtar(n.nome, max);
      if (max !== 99 && nome === n.nome) continue;
      const larg = Math.max(ctx.measureText(nome).width, 28);
      for (const yy of [yAbaixo, yAcima]) {  // embaixo; se colidir, em cima do no
        const r = [n.sx - larg / 2 - 3, yy - 1, n.sx + larg / 2 + 3, yy + fonte * 2 + 4];
        if (forcado || !colide(r)) { achou = { nome, r }; y = yy; break; }
      }
      if (achou) break;
    }
    if (!achou) { escondidas++; continue; }
    ocupados.push(achou.r);
    ctx.globalAlpha = dim;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(5,8,15,0.9)';
    ctx.strokeText(achou.nome, n.sx, y);
    ctx.fillStyle = '#dbe6f7';
    ctx.fillText(achou.nome, n.sx, y);
    ctx.font = (fonte - 1) + 'px ui-monospace, Menlo, monospace';
    ctx.strokeText(contTxt, n.sx, y + fonte + 2);
    ctx.fillStyle = n.abertas ? '#9fd9ff' : '#6d7d96';
    ctx.fillText(contTxt, n.sx, y + fonte + 2);
    ctx.globalAlpha = 1;
  }
  etiquetasNo.length = 0;
}

function posicaoSessao(s, n, ks, dt) {
  const aceleracao = s.coluna === 'trabalhando' ? 2.4 : (s.aberta ? 1 : 0.55);
  s.ang += s.dir * s.vel * aceleracao * dt * escalaMovimento;
  const r = raioOrbita(s, n) * ks;
  s.sx = n.sx + Math.cos(s.ang) * r;
  s.sy = n.sy + Math.sin(s.ang) * r;
  s.r_orb = r;
}

function desenharSessoes(t, dt, ks) {
  const agoraS = agora();
  const lerpCor = 1 - Math.exp(-dt * 4);
  const rotulos = [];
  for (const s of ordemDesenho) {
    const n = nos.get(s.no);
    if (!n || n.fora) { s.visivel = false; continue; }
    // transicao suave de cor e de "vida"
    for (let i = 0; i < 3; i++) s.cor[i] = lerp(s.cor[i], s.alvoCor[i], lerpCor);
    s.vivacidade = lerp(s.vivacidade, s.aberta ? 1 : 0, lerpCor);
    posicaoSessao(s, n, ks, dt);
    s.visivel = true;

    const idade = limitar((agoraS - (s.ultimaAtividade || 0)) / (JANELA_DIAS * 86400), 0, 1);
    let alfa = s.aberta ? 1 : 0.06 + 0.5 * Math.pow(1 - idade, 1.3);
    alfa = lerp(alfa, 1, s.vivacidade);
    if (!s.casa) alfa *= 0.12;
    // efeito de surgimento
    let surgir = 1;
    if (s.animarNascimento) surgir = limitar((agoraS - s.nascimento) / 1.4, 0, 1);
    else if (!primeiraCarga) surgir = 1;
    const ease = 1 - Math.pow(1 - surgir, 3);
    const pulsante = corPulsante(s, t);
    const raioPonto = (s.aberta ? 4.6 : 3.3) * Math.max(0.85, ks) * (0.4 + 0.6 * ease);
    s.sr = raioPonto;
    s.alfa = alfa;

    // rastro curto para quem trabalha
    if (s.coluna === 'trabalhando' && s.r_orb > 0 && escalaMovimento >= 1) {
      const passoAng = s.dir * 0.09;
      for (let i = 1; i <= 9; i++) {
        const a = s.ang - passoAng * i;
        ctx.globalAlpha = alfa * (0.5 - i * 0.052);
        ctx.fillStyle = rgba(s.cor, 1);
        ctx.beginPath();
        ctx.arc(n.sx + Math.cos(a) * s.r_orb, n.sy + Math.sin(a) * s.r_orb, raioPonto * (1 - i * 0.08), 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // halo
    let raioHalo = raioPonto * 3.2, forcaHalo = 0;
    if (s.coluna === 'atencao') { raioHalo = raioPonto * (4.2 + (escalaMovimento < 1 ? 0 : 1.4 * Math.sin(t * 7 + s.fase))); forcaHalo = 0.95 * pulsante; }
    else if (s.coluna === 'trabalhando') { forcaHalo = 0.55 * pulsante; }
    else if (s.coluna === 'suaVez') { forcaHalo = s.nova ? 0.95 : 0.36; raioHalo = raioPonto * (s.nova ? 4.6 : 3); }
    else forcaHalo = 0.12 * s.vivacidade;
    desenharBrilho(s.alvoCor, s.sx, s.sy, raioHalo, forcaHalo * alfa * ease);

    // ponto
    const raioDesenho = s.coluna === 'trabalhando' && escalaMovimento >= 1 ? raioPonto * (1 + 0.16 * Math.sin(t * 3.2 + s.fase)) : raioPonto;
    ctx.globalAlpha = alfa * ease * (s.coluna === 'atencao' ? pulsante : 1);
    ctx.fillStyle = rgba(s.cor, 1);
    ctx.beginPath(); ctx.arc(s.sx, s.sy, raioDesenho, 0, 6.2832); ctx.fill();
    if (s.aberta) {
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.arc(s.sx - raioDesenho * 0.25, s.sy - raioDesenho * 0.25, raioDesenho * 0.35, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // anel do surgimento e da mudanca de estado
    if (s.animarNascimento && surgir < 1) {
      ctx.strokeStyle = rgba(s.alvoCor, (1 - surgir) * 0.9);
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(s.sx, s.sy, raioPonto + 4 + surgir * 34, 0, 6.2832); ctx.stroke();
    }
    const dtPulso = agoraS - s.pulso;
    if (s.pulso && dtPulso < 1.6 && !(s.animarNascimento && surgir < 1) && escalaMovimento >= 1) {
      ctx.strokeStyle = rgba(s.alvoCor, (1 - dtPulso / 1.6) * 0.8);
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(s.sx, s.sy, raioPonto + 3 + dtPulso * 20, 0, 6.2832); ctx.stroke();
    }

    // subagentes: satelites rapidos
    const coresSat = coresSatelites(s);
    const sat = Math.min(coresSat.length, 6);
    for (let i = 0; i < sat; i++) {
      const a = t * 4.2 * (escalaMovimento < 1 ? 0.3 : 1) + (i * 6.2832) / sat;
      const rs = raioPonto + 5.5 + (i % 2) * 2.5;
      ctx.fillStyle = rgba(coresSat[i], 0.95);
      ctx.beginPath(); ctx.arc(s.sx + Math.cos(a) * rs, s.sy + Math.sin(a) * rs, 1.7, 0, 6.2832); ctx.fill();
    }

    if (busca && s.casa) {
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(s.sx, s.sy, raioPonto + 5, 0, 6.2832); ctx.stroke();
    }
    if (s.id === selecionada) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(s.sx, s.sy, raioPonto + 8 + (escalaMovimento < 1 ? 0 : Math.sin(t * 3)), 0, 6.2832); ctx.stroke();
      ctx.setLineDash([]);
    }

    // rotulos: abertas (se houver espaco) e hover/selecao
    const destaque = s === hover || s.id === selecionada;
    const recente = agoraS - (s.ultimaAtividade || 0) < 2 * 86400;
    const mostrar = destaque || (s.casa && (
      (s.aberta && (cam.k >= 0.42 || s.coluna === 'atencao' || s.coluna === 'trabalhando' || busca))
      || (noFoco && (s.aberta || recente))));
    if (mostrar && ease > 0.6) rotulos.push(s);
  }

  // rotulos por cima de todos os pontos
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const fonte = limitar(10.5 + ks * 1.4, 10.5, 13);
  rotulos.sort((a, b) => ORDEM_COLUNA[a.coluna] - ORDEM_COLUNA[b.coluna]);
  const margemEsq = document.getElementById('lista').classList.contains('recolhida') ? 8 : 326;
  const margemDir = document.getElementById('detalhe').classList.contains('aberto') ? 376 : 8;
  for (const s of rotulos) {
    if (agoraS - s.rotuloEm >= 1 || !s.rotulo) { s.rotulo = tituloCurto(s, 30) + '  ·  ' + tempoDe(s, agoraS); s.rotuloEm = agoraS; }
    const n = nos.get(s.no);
    // para fora da orbita: segue a direcao centro do no -> ponto, assim nao cai em cima do nome do no
    const cx = Math.cos(s.ang), cy = Math.sin(s.ang);
    const dist = s.sr + 9;
    const ancX = s.sx + cx * dist, ancY = s.sy + cy * dist;
    const dir = cx >= 0 ? 1 : -1;
    ctx.font = (s.coluna === 'atencao' || s === hover ? '600 ' : '') + fonte + 'px system-ui, sans-serif';
    const larg = ctx.measureText(s.rotulo).width;
    const altP = fonte + 8;
    // a pilula fica dentro da area visivel (fora da lista, do detalhe, da barra e da legenda)
    const x0 = limitar(dir > 0 ? ancX : ancX - larg - 14, margemEsq, Math.max(margemEsq, L - margemDir - larg - 14));
    const y0 = limitar(ancY - altP / 2 + cy * altP * 0.5, 68, A - 52 - docaPx() - altP);
    const retang = [x0, y0, x0 + larg + 14, y0 + altP];
    if (!(s === hover || s.id === selecionada) && colide(retang)) continue;
    ocupados.push(retang);
    ctx.globalAlpha = s.aberta ? 1 : 0.95;
    ctx.fillStyle = 'rgba(6, 11, 22, 0.82)';
    ctx.strokeStyle = rgba(s.alvoCor, 0.55);
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x0, y0, larg + 14, altP, altP / 2); else ctx.rect(x0, y0, larg + 14, altP);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = s.coluna === 'atencao' ? '#ffc2c8' : s.coluna === 'trabalhando' ? '#ffdf9e' : s.coluna === 'suaVez' ? '#c2f5da' : '#b4bfd1';
    ctx.textAlign = 'left';
    ctx.fillText(s.rotulo, x0 + 7, y0 + altP / 2 + 0.5);
    ctx.globalAlpha = 1;
  }
}

let ultimoQuadro = performance.now();
let acumFps = 0, quadros = 0;
function quadro(agoraMs) {
  const dt = Math.min(0.05, (agoraMs - ultimoQuadro) / 1000);
  ultimoQuadro = agoraMs;
  tAnim += dt;
  const t = tAnim;

  // camera suave
  const f = 1 - Math.exp(-dt * 9);
  if (seguindo) {
    const s = sessoes.get(seguindo);
    if (s && s.visivel) { const [wx, wy] = paraMundo(s.sx, s.sy); alvo.x = wx; alvo.y = wy; }
  }
  cam.x = lerp(cam.x, alvo.x, f); cam.y = lerp(cam.y, alvo.y, f);
  cam.k = Math.exp(lerp(Math.log(cam.k), Math.log(alvo.k), f));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  desenharFundo(t);
  desenharRegioes(t);
  const ks = escalaVisual();
  desenharNos(t, ks);
  desenharSessoes(t, dt, ks);
  desenharEtiquetasNo(ks);

  requestAnimationFrame(quadro);
}

// ---------- interacao ----------
function aoRedimensionar() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  L = window.innerWidth; A = window.innerHeight;
  canvas.width = Math.round(L * dpr); canvas.height = Math.round(A * dpr);
}
window.addEventListener('resize', aoRedimensionar);

function sessaoEm(px, py) {
  let melhor = null, dm = Infinity;
  for (const s of sessoes.values()) {
    if (!s.visivel || !s.casa) continue;
    const d = Math.hypot(s.sx - px, s.sy - py);
    const lim = Math.max(9, s.sr + 5);
    if (d <= lim && d < dm) { dm = d; melhor = s; }
  }
  return melhor;
}
function noEm(px, py) {
  for (const n of nos.values()) if (!n.fora && Math.hypot(n.sx - px, n.sy - py) <= n.sr + 4) return n;
  return null;
}
function regiaoEm(px, py) {
  const [wx, wy] = paraMundo(px, py);
  let melhor = null, dm = Infinity;
  for (const r of regioes) {
    const d = Math.hypot(wx - r.x, wy - r.y);
    if (d <= r.raio && d < dm) { dm = d; melhor = r; }
  }
  return melhor;
}
function ptr(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  canvas.focus({ preventScroll: true });
  const [px, py] = ptr(e);
  const s = sessaoEm(px, py), n = s ? null : noEm(px, py);
  arrasto = { tipo: n ? 'no' : 'fundo', no: n, s, x0: px, y0: py, ux: px, uy: py, moveu: false };
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* evento sintetico ou ponteiro inativo */ }
});
canvas.addEventListener('pointermove', e => {
  const [px, py] = ptr(e);
  if (arrasto) {
    const dx = px - arrasto.ux, dy = py - arrasto.uy;
    if (!arrasto.moveu && Math.hypot(px - arrasto.x0, py - arrasto.y0) > 4) arrasto.moveu = true;
    if (arrasto.moveu && !arrasto.s) {
      if (arrasto.tipo === 'no') {
        arrasto.no.x += dx / cam.k; arrasto.no.y += dy / cam.k;
      } else {
        cam.x -= dx / cam.k; cam.y -= dy / cam.k; alvo.x = cam.x; alvo.y = cam.y; alvo.k = cam.k;
        seguindo = null;
      }
    }
    arrasto.ux = px; arrasto.uy = py;
    esconderDica();
    return;
  }
  hover = sessaoEm(px, py);
  hoverNo = hover ? null : noEm(px, py);
  canvas.style.cursor = hover || hoverNo ? 'pointer' : 'grab';
  mostrarDica(e, hover, hoverNo);
});
canvas.addEventListener('pointerup', async e => {
  const a = arrasto; arrasto = null;
  if (!a) return;
  if (a.tipo === 'no' && a.moveu) {
    try {
      const r = await fetch('/api/posicao', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN },
        body: JSON.stringify({ no: a.no.id, x: a.no.x, y: a.no.y }),
      });
      if (!r.ok) throw new Error(r.status);
    } catch (_) { /* a proxima atualizacao devolve a posicao salva */ }
  } else if (!a.moveu) {
    if (a.s) selecionar(a.s.id);
    else if (a.no) noSel = a.no.id;
    else { noSel = null; fecharDetalhe(); }
  }
});
canvas.addEventListener('pointerleave', () => { if (!arrasto) { hover = null; hoverNo = null; esconderDica(); } });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const [px, py] = ptr(e);
  const fator = Math.exp(-limitar(e.deltaY, -300, 300) * 0.0016);
  const k = limitar(alvo.k * fator, 0.06, 6);
  const wx = (px - L / 2) / alvo.k + alvo.x, wy = (py - A / 2) / alvo.k + alvo.y;
  alvo.k = k; alvo.x = wx - (px - L / 2) / k; alvo.y = wy - (py - A / 2) / k;
  seguindo = null;
}, { passive: false });
canvas.addEventListener('dblclick', e => {
  const [px, py] = ptr(e);
  if (sessaoEm(px, py)) return;
  const r = regiaoEm(px, py);
  if (r) enquadrar([r]);
});

document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('#doca, dialog')) return;  // digitando no terminal ou no dialogo
  const emCampo = e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement || e.target instanceof HTMLTextAreaElement;
  if (e.key === 'Escape') { busca = ''; document.getElementById('busca').value = ''; aplicarBusca(''); fecharDetalhe(); document.activeElement.blur(); return; }
  if (emCampo) return;
  if (e.key === '0') enquadrar();
  else if (!e.ctrlKey && !e.metaKey && e.key >= '1' && e.key <= '9' && +e.key - 2 < grandes.length) definirFoco([null, ...grandes][+e.key - 1]);
  else if (e.key === '/') { e.preventDefault(); document.getElementById('busca').focus(); }
  else if (e.key === '+' || e.key === '=') alvo.k = limitar(alvo.k * 1.25, 0.06, 6);
  else if (e.key === '-') alvo.k = limitar(alvo.k / 1.25, 0.06, 6);
});

function sincronizarFoco(reescrever) {
  const p = new URLSearchParams(location.search);
  const v = valorFoco(foco);
  if (v) p.set('foco', v); else p.delete('foco');
  const q = p.toString();
  history.replaceState(null, '', location.pathname + (q ? '?' + q.replace(/%2F/gi, '/') : ''));
  document.querySelectorAll('#seg-foco .bt').forEach(b => {

}
function atualizarTitulo() {
  const aten = [...sessoes.values()].filter(s => s.coluna === 'atencao').length;
  document.title = (aten ? '(' + aten + ') ' : '') + tituloFoco();
}
function definirFoco(regiao, no) {
  noSel = null;
  foco = { regiao: regiao || null, no: regiao ? no || null : null };
  sincronizarFoco();
  fecharDetalhe();
  if (dados) { primeiraCarga = true; aplicarEstado(dados); }  // sem efeito de surgimento em tudo de uma vez
  enquadrar();
}
function atualizarSeletores() {
  // projetos avulsos: com sessao aberta primeiro, com contador abertas/total
  const proj = document.getElementById('sel-proj');
  const por = new Map();
  for (const n of todosNos) {
    if (grandes.includes(n.regiao)) continue;
    const r = por.get(n.regiao) || { id: n.regiao, abertas: 0, total: 0 };
    r.abertas += n.abertas; r.total += n.total; por.set(n.regiao, r);
  }
  const lista = [...por.values()].sort((a, b) => (b.abertas > 0) - (a.abertas > 0) || a.id.localeCompare(b.id));
  const ass = foco.regiao + '|' + lista.map(r => r.id + r.abertas + '/' + r.total).join(',');
  if (proj.dataset.ass !== ass) {
    proj.dataset.ass = ass;
    proj.textContent = '';
    const o0 = el('option', null, 'Projetos (' + lista.length + ')'); o0.value = '';
    proj.append(o0);
    for (const r of lista) { const o = el('option', null, r.id + '  (' + r.abertas + '/' + r.total + ')'); o.value = r.id; proj.append(o); }
    proj.value = por.has(foco.regiao) ? foco.regiao : '';
  }
  proj.classList.toggle('ativo', por.has(foco.regiao));
  proj.hidden = !lista.length;

  const sel = document.getElementById('sel-no');
  const nosR = todosNos.filter(n => n.regiao === foco.regiao).sort((a, b) => a.nome.localeCompare(b.nome));
  sel.hidden = !foco.regiao || nosR.length < 2;
  if (sel.hidden) { sel.dataset.ass = ''; return; }
  const assinatura = foco.regiao + '|' + foco.no + '|' + nosR.map(n => n.id + n.abertas + '/' + n.total).join(',');
  if (sel.dataset.ass === assinatura) return;
  sel.dataset.ass = assinatura;
  sel.textContent = '';
  const todos = el('option', null, 'todos os projetos'); todos.value = '';
  sel.append(todos);
  for (const n of nosR) { const o = el('option', null, n.nome + ' (' + n.abertas + '/' + n.total + ')'); o.value = n.id; sel.append(o); }
  sel.value = foco.no || '';
}

function larguraAposArrasto(esq, dir, dx, min) {  // divisoria entre duas colunas: soma preservada, minimo respeitado
  const total = esq + dir;

function ligarDivisor(d, esq, dir) {
  d.addEventListener('pointerdown', e => {
    e.preventDefault();
    d.setPointerCapture(e.pointerId);
    medirLarguras();
    const x0 = e.clientX, e0 = esq.el.offsetWidth, d0 = dir.el.offsetWidth;
    d.classList.add('arrastando');
    const mover = ev => { [esq.larg, dir.larg] = larguraAposArrasto(e0, d0, ev.clientX - x0, LARG_MIN_COLUNA); aplicarLarguras(); };
    const fim = () => {
      d.classList.remove('arrastando');
      d.removeEventListener('pointermove', mover); d.removeEventListener('pointerup', fim); d.removeEventListener('pointercancel', fim);
      salvarLayout(); agendarReajuste();

    d.addEventListener('pointermove', mover); d.addEventListener('pointerup', fim); d.addEventListener('pointercancel', fim);
  });
}

function definirColunaAtiva(c) {
  if (!c) return;
  const mudou = colAtiva !== c;
  colAtiva = c;
  ativoJob = c.ativa;
  for (const x of colunas) x.el.classList.toggle('col-ativa', x === c);
  if (mudou) salvarLayout();
}
function mostrarNaColuna(c, job) {
  c.ativa = job;
  for (const id of c.jobs) {
    const t = terminais.get(id);
    if (!t) continue;
    const ativa = id === job;
    t.aba.classList.toggle('ativa', ativa);
    t.aba.setAttribute('aria-selected', ativa);
    t.area.classList.toggle('ativa', ativa);
  }
  if (colAtiva === c) ativoJob = job;
  const t = terminais.get(job);
  if (t) requestAnimationFrame(() => { ajustar(t); if (t.conv) { rolarSeNoFim(t); puxarConversa(t); } });
}
function criarColuna(ref, lado) {
  medirLarguras();
  const c = { jobs: [], ativa: null, larg: 1 };
  c.el = el('div', 'coluna');
  c.barra = el('div', 'col-barra');
  c.abasEl = el('div', 'col-abas'); c.abasEl.setAttribute('role', 'tablist');
  const dividir = el('button', 'bt col-dividir'); dividir.innerHTML = ICONE_DIVIDIR;
  dividir.title = 'Dividir: mover esta aba para uma nova coluna à direita (Ctrl+\\)'; dividir.setAttribute('aria-label', 'Dividir em nova coluna');
  dividir.addEventListener('click', () => dividirAba(terminais.get(c.ativa)));
  c.barra.append(c.abasEl, dividir);
  c.corpo = el('div', 'col-corpo');
  c.el.append(c.barra, c.corpo);
  const i = ref ? colunas.indexOf(ref) + (lado === 'esq' ? 0 : 1) : colunas.length;
  if (ref) { ref.larg = c.larg = Math.max(ref.larg / 2, LARG_MIN_COLUNA / 2); }
  colunas.splice(i, 0, c);
  contColunas.insertBefore(c.el, colunas[i + 1] ? colunas[i + 1].el : null);
  c.el.addEventListener('pointerdown', () => definirColunaAtiva(c), true);
  c.el.addEventListener('focusin', () => definirColunaAtiva(c));
  ligarSoltaNaBarra(c);
  ligarSoltaNoCorpo(c);

  return c;
}
function removerColuna(c) {
  const i = colunas.indexOf(c);
  if (i < 0) return;
  colunas.splice(i, 1);
  c.el.remove();
  if (colAtiva === c) { colAtiva = null; if (colunas.length) definirColunaAtiva(colunas[Math.min(i, colunas.length - 1)]); }
  reconstruirDivisores();
  agendarReajuste();
}

function moverAba(t, destino, indice) {
  const origem = t.col;
  const rolagem = t.conv && t.conv.scroller ? t.conv.scroller.scrollTop : null;
  const iOrigem = origem.jobs.indexOf(t.job);
  origem.jobs.splice(iOrigem, 1);
  destino.jobs.splice(Math.min(Math.max(indice, 0), destino.jobs.length), 0, t.job);
  t.col = destino;
  for (const id of destino.jobs) destino.abasEl.append(terminais.get(id).aba);  // so reordena as abas (a barra)
  if (origem !== destino) destino.corpo.append(t.area);  // o mesmo elemento muda de lugar: xterm e WebSocket intactos
  if (!origem.jobs.length) removerColuna(origem);
  else if (origem !== destino && origem.ativa === t.job) mostrarNaColuna(origem, origem.jobs[Math.min(iOrigem, origem.jobs.length - 1)]);
  mostrarNaColuna(destino, t.job);
  ativarAba(t.job);
  if (rolagem != null) t.conv.scroller.scrollTop = rolagem;
  reconstruirDivisores();
  salvarLayout();
  agendarReajuste();
}
function moverParaNovaColuna(t, ref, lado) {
  const origem = t.col;
  if (origem === ref && origem.jobs.length === 1) return;  // coluna so com esta aba: nada muda
  if (colunas.length >= MAX_COLUNAS && origem.jobs.length > 1) { aviso('No máximo ' + MAX_COLUNAS + ' colunas.', true); return; }
  moverAba(t, criarColuna(ref, lado), 0);
}
function dividirAba(t) {
  if (!t) return;
  if (t.col.jobs.length < 2) { aviso('Só há uma aba nesta coluna: abra outra sessão ou arraste uma aba para o lado.'); return; }
  moverParaNovaColuna(t, t.col, 'dir');
}

// ---- arrastar e soltar abas ----
function abaDeTipo(ev) { return !!arrastando && ev.dataTransfer && [...ev.dataTransfer.types].includes(TIPO_ABA); }
function abasSemArrastada(c) { return c.jobs.map(j => terminais.get(j)).filter(t => t && t !== arrastando).map(t => t.aba); }
function indiceDaSoltaNaBarra(c, x) {
  return indiceDeSolta(abasSemArrastada(c).map(a => { const r = a.getBoundingClientRect(); return r.left + r.width / 2; }), x);
}
function ligarSoltaNaBarra(c) {
  c.barra.addEventListener('dragover', ev => {
    if (!abaDeTipo(ev)) return;
    ev.preventDefault(); ev.dataTransfer.dropEffect = 'move';
    zonaSolta.style.display = 'none';
    const outras = abasSemArrastada(c), i = indiceDaSoltaNaBarra(c, ev.clientX);
    const rb = c.abasEl.getBoundingClientRect();
    const x = !outras.length ? rb.left + 2 : i < outras.length ? outras[i].getBoundingClientRect().left - 3 : outras[outras.length - 1].getBoundingClientRect().right + 1;
    Object.assign(marcaSolta.style, { display: 'block', left: x + 'px', top: rb.top + 2 + 'px', height: rb.height - 4 + 'px' });
  });
  c.barra.addEventListener('dragleave', ev => { if (!c.barra.contains(ev.relatedTarget)) esconderMarcas(); });
  c.barra.addEventListener('drop', ev => {
    if (!abaDeTipo(ev)) return;
    ev.preventDefault();
    const t = arrastando, i = indiceDaSoltaNaBarra(c, ev.clientX);
    esconderMarcas();
    moverAba(t, c, i);
  });
}
function ligarSoltaNoCorpo(c) {
  const permitido = () => !(c === arrastando.col && c.jobs.length === 1) && !(colunas.length >= MAX_COLUNAS && arrastando.col.jobs.length > 1);
  c.corpo.addEventListener('dragover', ev => {
    if (!abaDeTipo(ev)) return;
    marcaSolta.style.display = 'none';
    if (!permitido()) { zonaSolta.style.display = 'none'; ev.dataTransfer.dropEffect = 'none'; if (c === arrastando.col && c.jobs.length === 1) return; ev.preventDefault(); return; }
    ev.preventDefault(); ev.dataTransfer.dropEffect = 'move';
    const r = c.corpo.getBoundingClientRect();
    const lado = ladoDaSolta(ev.clientX, r.left, r.width);
    Object.assign(zonaSolta.style, { display: 'block', top: r.top + 'px', height: r.height + 'px', width: r.width / 2 + 'px', left: (lado === 'esq' ? r.left : r.left + r.width / 2) + 'px' });
  });
  c.corpo.addEventListener('dragleave', ev => { if (!c.corpo.contains(ev.relatedTarget)) esconderMarcas(); });
  c.corpo.addEventListener('drop', ev => {
    if (!abaDeTipo(ev)) return;
    ev.preventDefault();
    const r = c.corpo.getBoundingClientRect();
    const lado = ladoDaSolta(ev.clientX, r.left, r.width), t = arrastando;
    esconderMarcas();
    moverParaNovaColuna(t, c, lado);
  });
}

// Ctrl+\ divide; Ctrl+1..4 focam a coluna (ignorados com o foco no xterm: la o Ctrl+\ e o SIGQUIT do terminal)
document.addEventListener('keydown', e => {
  if (!e.ctrlKey || e.altKey || e.metaKey || e.shiftKey || doca.hidden || !colunas.length) return;
  if (e.target.closest && e.target.closest('.xterm, dialog')) return;
  if (e.key === '\\' || e.code === 'Backslash') {
    e.preventDefault(); e.stopPropagation();
    dividirAba(terminais.get(ativoJob));
  } else if (e.key >= '1' && e.key <= '4') {
    const c = colunas[+e.key - 1];
    if (!c) return;
    e.preventDefault(); e.stopPropagation();
    if (c.ativa) ativarAba(c.ativa); else definirColunaAtiva(c);
    const t = terminais.get(c.ativa);
    if (t && t.composer) requestAnimationFrame(() => t.composer.querySelector('textarea').focus());
  }
}, true);

let layoutRestaurado = false;
function restaurarLayout() {  // uma vez, apos o primeiro estado (so reabre sessoes que ainda existem)
  if (layoutRestaurado) return;
  layoutRestaurado = true;
  if (!window.Terminal || !window.FitAddon) return;
  let salvo = null;
  try { salvo = JSON.parse(sessionStorage.getItem(CHAVE_LAYOUT) || 'null'); } catch (_) { return; }
  if (!salvo || !Array.isArray(salvo.cols)) return;
  const vivos = new Set([...sessoes.values()].map(s => s.jobId).filter(Boolean));
  restaurando = true;
  const feitas = [];
  for (const sc of salvo.cols.slice(0, MAX_COLUNAS)) {
    const abas = (sc && Array.isArray(sc.abas) ? sc.abas : []).filter(a => a && typeof a.job === 'string' && vivos.has(a.job));
    if (!abas.length) continue;
    const c = criarColuna(feitas.length ? feitas[feitas.length - 1].c : null, 'dir');
    definirColunaAtiva(c);
    for (const a of abas) abrirTerminal(a.job, a.nome);
    if (c.jobs.includes(sc.ativa)) mostrarNaColuna(c, sc.ativa);
    feitas.push({ c, larg: sc.larg });
  }
  const larg = normalizarLarguras(feitas.map(f => f.larg), feitas.length);
  feitas.forEach((f, i) => { f.c.larg = larg[i]; });
  aplicarLarguras();
  restaurando = false;
  if (feitas.length) {
    const alvoCol = (feitas[salvo.ativa] || feitas[0]).c;
    definirColunaAtiva(alvoCol);
    if (alvoCol.ativa) ativarAba(alvoCol.ativa);
    agendarReajuste();
  }
  salvarLayout();
}

function ativarAba(job) {
  const t = terminais.get(job);
  if (!t) return;
  mostrarNaColuna(t.col, job);
  definirColunaAtiva(t.col);
  requestAnimationFrame(() => focarAba(t));
}
function focarAba(t) {
  if (t.modo === 'terminal' && t.term) t.term.focus();
  else if (t.composer) t.composer.querySelector('textarea').focus();
}
// Conversa (transcrito renderizado) ou Terminal (o xterm do attach, para menus e permissoes)
function definirModo(t, modo) {
  if (!t.term) modo = 'conversa';
  t.modo = modo;
  t.area.classList.toggle('modo-terminal', modo === 'terminal');
  if (t.botoesModo) for (const [m, b] of Object.entries(t.botoesModo)) { b.classList.toggle('ativo', m === modo); b.setAttribute('aria-pressed', m === modo); }
  requestAnimationFrame(() => { ajustar(t); if (modo === 'conversa') rolarSeNoFim(t); focarAba(t); });
}
let seqPendente = 0;
function criarAba(chave, nome, somenteLeitura) {
  mostrarDoca(true);
  if (!colAtiva) definirColunaAtiva(criarColuna(null));
  const col = colAtiva;  // aba nova entra na coluna ativa
  const area = el('div', 'term');
  const vista = el('div', 'vista');

  const xarea = el('div', 'term-x');
  vista.append(conversaEl, xarea);
  const pergunta = el('div', 'pergunta'); pergunta.hidden = true;
  area.append(vista, pergunta);
  col.corpo.append(area);
  let term = null, fit = null;
  if (!somenteLeitura) {
    term = new Terminal({
      cursorBlink: true, fontSize: 13, scrollback: 5000, allowProposedApi: false, theme: temaTerminal,
      fontFamily: 'ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace',
    });

  aba.append(rotulo, x);

    modo: 'conversa', composer: null, col };
  terminais.set(chave, t);

  if (term) {
    const seg = el('div', 'modo-seg');
    t.botoesModo = { conversa: el('button', null, 'Conversa'), terminal: el('button', null, 'Terminal') };
    t.botoesModo.conversa.title = 'Mensagens renderizadas: selecione e copie à vontade';
    t.botoesModo.terminal.title = 'O terminal do Claude (Ctrl+Esc alterna)';
    for (const [m, b] of Object.entries(t.botoesModo)) { b.addEventListener('click', () => definirModo(t, m)); seg.append(b); }

  }

  salvarLayout();

}

// liga o terminal ao servidor; o que o composer enfileirou antes vai embora quando a tela do attach aparece
function conectarTerminal(t, job) {
  const term = t.term;
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/terminal?id=' + encodeURIComponent(job)
    + '&token=' + encodeURIComponent(TOKEN) + '&cols=' + term.cols + '&linhas=' + term.rows;
  const ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  t.ws = ws; t.pronto = false;
  ws.onmessage = ev => {
    if (typeof ev.data !== 'string') {
      term.write(new Uint8Array(ev.data));
      if (!t.pronto) { t.pronto = true; setTimeout(() => descarregarFila(t), 700); }
      return;
    }
    try {  // texto = controle do servidor (erro do composer)
      const j = JSON.parse(ev.data);
      if (j && j.tipo === 'erro') aviso(j.mensagem || 'erro no envio', true);
    } catch (_) { term.write(ev.data); }
  };
  ws.onopen = () => ajustar(t);
  ws.onclose = () => {
    if (t.ws !== ws) return;  // conexao antiga (aba promovida ou reconectada)
    term.write('\r\n\x1b[2m[desanexado: a sessão continua rodando]\x1b[0m\r\n');
    t.aba.classList.add('desanexada');
    t.composer.classList.add('off');
    avisoNaConversa(t, 'Desanexado: a sessão continua rodando em segundo plano. Reabra pelo mapa.');
  };
}
function descarregarFila(t) {
  if (!t.fila.length || t.fechada) return;
  // dialogo na tela (MCP do projeto, permissao): o texto cairia nele; espera a pessoa responder no terminal
  if (t.menuTela || t.dialogoTela) { setTimeout(() => descarregarFila(t), 500); return; }
  while (t.fila.length && t.ws && t.ws.readyState === 1) t.ws.send(JSON.stringify(t.fila.shift()));
}

function abrirTerminal(job, nome) {
  if (!window.Terminal || !window.FitAddon) { aviso('Biblioteca do terminal não carregou.', true); return null; }
  if (terminais.has(job)) { mostrarDoca(true); ativarAba(job); return terminais.get(job); }
  const t = criarAba(job, nome);
  conectarTerminal(t, job);
  criarComposer(t);
  t.composer.querySelector('textarea').focus();
  puxarConversa(t);
  return t;
}

// aba que aparece na hora ("iniciando...") enquanto a sessao ainda esta sendo criada
function abrirTerminalPendente() {
  if (!window.Terminal || !window.FitAddon) { aviso('Biblioteca do terminal não carregou.', true); return null; }
  const t = criarAba('pendente:' + (++seqPendente), 'iniciando…');
  t.pendente = true;
  t.term.write('\x1b[2miniciando a sessão…\x1b[0m\r\n');
  t.conv.vazio.textContent = 'Iniciando a sessão… você já pode escrever: a mensagem vai assim que ela conectar.';
  criarComposer(t);
  t.composer.querySelector('textarea').focus();
  return t;
}
function promoverTerminal(t, job, nome) {
  const antigo = t.job;
  terminais.delete(antigo);
  t.term.reset();  // some o "iniciando..." / dialogo; o attach redesenha a tela
  t.job = job; t.pendente = false; t.nome = nome || job;
  t.rotulo.textContent = t.nome;
  terminais.set(job, t);
  if (ativoJob === antigo) ativoJob = job;
  const iCol = t.col.jobs.indexOf(antigo);
  if (iCol >= 0) t.col.jobs[iCol] = job;
  if (t.col.ativa === antigo) t.col.ativa = job;
  salvarLayout();
  conectarTerminal(t, job);
  atualizarModeloDoTerminal(t);
  t.composer.classList.remove('off');
  t.conv.vazio.textContent = 'Sessão pronta. Escreva abaixo.';
  definirModo(t, 'conversa');
  puxarConversa(t);
}

const ROTULO_MODELO = Object.fromEntries([['opus', 'Opus 5.5'], ['sonnet', 'Sonnet 5.5'], ['haiku', 'Haiku 5.5'], ['fable', 'Fable 5.1']]);
async function criarSessaoRapida(noId) {
  const t = abrirTerminalPendente();
  if (!t) return;
  const { modelo, esforco, nome } = padraoNovaSessao;  // nome so existe em testes (para identificar e limpar a sessao)
  t.modeloAtual = modelo; t.modeloRotulo = ROTULO_MODELO[modelo]; t.esforco = esforco; t.pintarPilulas();
  await tentarCriar(t, noId, { modelo, esforco, nome });
}

// cria a sessao --bg na aba pendente; pasta nao confiavel leva ao fluxo oficial de confianca na mesma aba
async function tentarCriar(t, noId, { modelo, esforco, nome }) {
  const no = todosNos.find(n => n.id === noId);
  t.pendente = true;
  const r = await postar('/api/nova-sessao', nome ? { no: noId, modelo, esforco, nome } : { no: noId, modelo, esforco });
  if (![...terminais.values()].includes(t)) { aviso(r.ok ? 'Sessão criada, mas a aba foi fechada (ela segue rodando).' : (r.dados.erro || 'Não foi possível criar a sessão.'), !r.ok); return; }
  if (r.ok) {
    removerAvisoConfianca(t);
    guardarEsforco(r.dados.jobId, esforco);
    promoverTerminal(t, r.dados.jobId, no ? no.nome : r.dados.jobId);
    return;
  }
  if (r.dados.codigo === 'nao_confiavel') { mostrarConfianca(t, noId, { modelo, esforco, nome }); return; }
  t.term.write('\r\n\x1b[31m' + (r.dados.erro || 'não foi possível criar a sessão') + '\x1b[0m\r\n');
  t.conv.vazio.textContent = '';
  avisoNaConversa(t, r.dados.erro || 'Não foi possível criar a sessão.', 'erro');
  t.aba.classList.add('desanexada'); t.composer.classList.add('off'); t.rotulo.textContent = 'falhou';
  aviso(r.dados.erro || 'Não foi possível criar a sessão.', true);
}

// ---- confianca da pasta (dialogo oficial do Claude numa PTY, aceito pelo usuario no xterm) ----
function removerAvisoConfianca(t) { if (t.avisoConfianca) { t.avisoConfianca.remove(); t.avisoConfianca = null; } }
function mostrarAvisoConfianca(t, texto, botoes) {

  const caixa = el('div', 'aviso-confianca');
  caixa.append(el('span', null, texto));
  for (const [rotulo, acao] of botoes) { const b = el('button', 'bt', rotulo); b.addEventListener('click', acao); caixa.append(b); }
  t.vista.append(caixa);  // fora do xterm: aparece nos dois modos
  t.avisoConfianca = caixa;
}
function mostrarConfianca(t, noId, params) {
  t.rotulo.textContent = 'pasta não confiável';
  t.term.write('\r\n\x1b[33mEsta pasta ainda não é confiável para o Claude.\x1b[0m\r\n');
  mostrarAvisoConfianca(t, 'Esta pasta ainda não é confiável para o Claude.', [['Confiar nesta pasta', () => iniciarConfianca(t, noId, params)]]);
}
function iniciarConfianca(t, noId, params) {
  removerAvisoConfianca(t);
  definirModo(t, 'terminal');  // o dialogo oficial e respondido no xterm
  t.term.reset();
  t.term.write('\x1b[2mabrindo o diálogo oficial de confiança… responda aqui com o teclado\x1b[0m\r\n');
  t.rotulo.textContent = 'confiar na pasta?';
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/confiar?no=' + encodeURIComponent(noId)
    + '&token=' + encodeURIComponent(TOKEN) + '&cols=' + t.term.cols + '&linhas=' + t.term.rows;
  const ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  t.ws = ws;
  let desfecho = null;
  ws.onopen = () => { ajustar(t); t.term.focus(); };  // o usuario responde no xterm (o composer segue enfileirando)
  ws.onmessage = ev => {
    if (typeof ev.data !== 'string') { t.term.write(new Uint8Array(ev.data)); return; }
    let j = null;
    try { j = JSON.parse(ev.data); } catch (_) { return; }
    if (!j || j.tipo !== 'confianca') return;
    desfecho = j.estado;
    if (j.estado === 'aceita') {
      t.ws = null;
      t.term.reset();
      t.term.write('\x1b[2mconfiança aceita; criando a sessão…\x1b[0m\r\n');
      t.rotulo.textContent = 'iniciando…';
      tentarCriar(t, noId, params);  // refaz o --bg com o mesmo modelo/esforco; a fila do composer segue preservada
    } else if (j.estado === 'recusada') {
      t.ws = null;
      t.rotulo.textContent = 'pasta não confiada';
      t.composer.classList.add('off');
      mostrarAvisoConfianca(t, 'Pasta não confiada.', [['Fechar aba', () => fecharAba(t.job)]]);
    }
  };
  ws.onclose = () => {
    if (desfecho || ![...terminais.values()].includes(t)) return;
    t.ws = null;
    mostrarAvisoConfianca(t, 'A conexão do diálogo de confiança caiu.', [['Tentar de novo', () => iniciarConfianca(t, noId, params)], ['Fechar aba', () => fecharAba(t.job)]]);
  };
}

// pasta da nova sessao: no selecionado > no do foco > geral da regiao do foco; null = perguntar (foco Tudo)
function noParaNovaSessao() {
  const comPasta = todosNos.filter(n => n.caminho);
  const ids = new Set(comPasta.map(n => n.id));
  if (noSel && ids.has(noSel)) return noSel;
  if (foco.no && ids.has(foco.no)) return foco.no;
  if (noFoco && ids.has(noFoco)) return noFoco;
  if (foco.regiao) {
    const daRegiao = comPasta.filter(n => n.regiao === foco.regiao);
    const geral = daRegiao.find(n => n.id === foco.regiao + '/geral');
    if (geral) return geral.id;
    if (daRegiao.length) return daRegiao[0].id;
  }
  return null;
}

function fecharAba(job) {
  const t = terminais.get(job);
  if (!t) return;
  t.fechada = true;
  clearTimeout(t.conv.timer);
  try { t.ws.close(); } catch (_) { /* ja fechado */ }
  if (t.term) t.term.dispose();
  t.aba.remove(); t.area.remove();
  terminais.delete(job);
  const col = t.col, i = col.jobs.indexOf(job);
  col.jobs.splice(i, 1);
  if (t.term) aviso('Aba fechada (só desanexa): a sessão continua rodando em segundo plano.');
  if (!col.jobs.length) removerColuna(col);
  else if (col.ativa === job) mostrarNaColuna(col, col.jobs[Math.min(i, col.jobs.length - 1)]);
  if (!terminais.size) { ativoJob = null; colAtiva = null; mostrarDoca(false); }
  else if (colAtiva && colAtiva.ativa) ativarAba(colAtiva.ativa);
  salvarLayout();
}
